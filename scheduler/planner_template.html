<meta charset="utf-8">
<title>LAUCV Class Scheduling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<!--__SUPABASE_JS__-->
<style>
/* Layout: white top bar with a centred search, a narrow icon menu whose groups open a small panel,
   and one working area per page. Home greets the person and lists what waits for them. */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #172030; --muted: #5a6575; --line: #dde1e7; --line2: #eceff3;
  --navy: #1b2f55; --navy-2: #24406f; --accent: #1f3f74; --accent-ink: #ffffff; --accent-soft: #e7ecf5; --lunch: #eceef2;
  --warn: #8a5a00; --warn-soft: #fff1cc; --bad: #b42318; --bad-soft: #fde4e1; --good: #1b6e40; --good-soft: #dcf2e4;
  --t-lec: #e2e9f6;  --t-lec-ink: #1d3a6b;
  --t-lab: #d9efe2;  --t-lab-ink: #155c35;
  --t-ge: #ebe6f7;   --t-ge-ink: #4a3787;
  --t-pe: #fce8cf;   --t-pe-ink: #7e4505;
  --t-cwts: #e6e8ec; --t-cwts-ink: #3a4352;
  --t-prac: #fae1ec; --t-prac-ink: #842050;
  --f-display: "Roboto", "Segoe UI", system-ui, sans-serif;
  --f-body: "Roboto", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Roboto Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --top: 64px;            /* height of the top bar */
  --rail: 92px;           /* width of the icon menu */
  --row: 30px;            /* half an hour; one hour is 60px */
  color-scheme: light;   /* always light, whatever the device or claude.ai theme */
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; letter-spacing: .005em; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h2 { font-weight: 500; font-size: 1.15rem; }
h3 { font-weight: 500; font-size: .95rem; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ----- app shell ----- */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; min-height: 100vh; }
.topbar { grid-column: 1 / -1; display: grid; grid-template-columns: auto minmax(220px, 560px) auto; justify-content: space-between; align-items: center; gap: 10px 20px; min-height: var(--top); padding: 8px 20px; background: var(--panel); color: var(--ink); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 15; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .mark { flex: none; width: 38px; height: 38px; border-radius: 9px; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .82rem; letter-spacing: .04em; }
.brand div { display: grid; line-height: 1.15; min-width: 0; }
.brand b { font-weight: 700; font-size: 1.05rem; color: var(--navy); letter-spacing: .02em; }
.brand span { font-size: .74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; }
.tb-field { display: flex; gap: 6px; align-items: center; }
.topbar select { font: inherit; font-size: .84rem; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px; max-width: 160px; }
.search { position: relative; width: 100%; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; font: inherit; font-size: .95rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px 10px 42px; }
.search input::placeholder { color: var(--muted); }
.search input:focus { background: var(--panel); border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(15,25,45,.16); max-height: 380px; overflow-y: auto; padding: 6px; z-index: 30; }
.results button { display: grid; grid-template-columns: 64px 1fr; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: .88rem; border: 0; background: transparent; color: var(--ink); padding: 7px 9px; border-radius: 8px; cursor: pointer; }
.results button:hover, .results button.on { background: var(--accent-soft); }
.results small { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.results em { font-style: normal; color: var(--muted); font-size: .8rem; display: block; }
.iconbtn { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; font: inherit; }
.iconbtn:hover { background: var(--bg); }
.iconbtn .sr, .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.iconbtn b { position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #d92d20; color: #fff; font-size: .68rem; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--panel); }
.avatar { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--navy); color: #fff; font: inherit; font-weight: 500; font-size: .86rem; letter-spacing: .03em; cursor: pointer; }
.avatar:hover { box-shadow: 0 0 0 3px var(--accent-soft); }
.usermenu { position: relative; }
.usermenu .pop { position: absolute; top: calc(100% + 8px); right: 0; width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(15,25,45,.16); padding: 8px; display: grid; gap: 2px; z-index: 30; }
.usermenu .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--line2); margin-bottom: 4px; display: grid; gap: 2px; }
.usermenu .who b { font-weight: 500; font-size: .95rem; }
.usermenu .who span { font-size: .8rem; color: var(--muted); }
.usermenu .pop button { font: inherit; font-size: .9rem; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.usermenu .pop button:hover { background: var(--bg); }
/* icon menu: one column of icons with their names; groups open a small panel beside it */
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 12px 6px 56px; position: sticky; top: var(--top); align-self: start; height: calc(100vh - var(--top)); overflow-y: auto; display: flex; flex-direction: column; gap: 4px; z-index: 14; }
.side .spacer { flex: 1; }
.rail { position: relative; display: grid; justify-items: center; gap: 5px; width: 100%; font: inherit; font-size: .72rem; font-weight: 500; line-height: 1.2; text-align: center; border: 0; background: transparent; color: var(--ink); padding: 6px 2px; cursor: pointer; }
.rail .ic { position: relative; width: 46px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--ink); }
.rail:hover .ic { background: var(--bg); }
.rail[aria-current="page"] .ic, .rail[aria-expanded="true"] .ic { background: var(--accent-soft); color: var(--accent); }
.rail[aria-current="page"] { color: var(--accent); }
.rail .ic b { position: absolute; top: -3px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #d92d20; color: #fff; font-size: .66rem; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--panel); }
.flyout { position: fixed; z-index: 35; width: 270px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 34px rgba(15,25,45,.18); padding: 14px 8px 8px; display: grid; gap: 2px; }
.flyout h2 { font-size: 1rem; font-weight: 700; padding: 0 10px 8px; }
.flyout button { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: inherit; font-size: .92rem; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 10px 10px; border-radius: 8px; cursor: pointer; }
.flyout button:hover { background: var(--bg); }
.flyout button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.flyout button small { color: var(--muted); font-size: .76rem; display: block; margin-top: 1px; }
.count { font-family: var(--f-mono); font-size: .7rem; font-weight: 500; padding: 1px 7px; border-radius: 999px; background: var(--lunch); color: var(--muted); }
.count.bad { background: var(--bad-soft); color: var(--bad); }
.publish { font: inherit; font-weight: 500; font-size: .86rem; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.publish:disabled { opacity: .55; cursor: not-allowed; }
.main { --px: 24px; --pt: 18px; padding: var(--pt) var(--px) 28px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.footer { grid-column: 2; position: sticky; bottom: 0; z-index: 12; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 20px; background: var(--panel); border-top: 1px solid var(--line); font-size: .84rem; color: var(--muted); }
.footer .grow { flex: 1; }
.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; }
.menu summary::-webkit-details-marker { display: none; }
.menu .pop { position: absolute; bottom: calc(100% + 6px); right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(15,25,45,.16); padding: 4px; display: grid; min-width: 220px; z-index: 30; }
.menu .pop button { font: inherit; font-size: .88rem; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.menu .pop button:hover { background: var(--accent-soft); }
.pagehead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 16px; }
.pagehead h1 { font-size: 1.5rem; font-weight: 500; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: .88rem; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: .88rem; }
.toast { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: .88rem; z-index: 50; box-shadow: 0 6px 18px rgba(0,0,0,.2); }

/* ----- common pieces ----- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.cardhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; }
.chip { font-size: .74rem; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip.none { background: var(--lunch); color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.navlabel { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; min-width: 70px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { font: inherit; font-size: .84rem; border: 0; background: transparent; color: var(--muted); padding: 5px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 500; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font: inherit; font-size: .83rem; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 3px 10px; border-radius: 999px; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.pill small { color: inherit; opacity: .75; font-family: var(--f-mono); font-size: .7rem; margin-left: 4px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .84rem; color: var(--muted); }
.facts b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .8rem; }
.btn { font: inherit; font-size: .85rem; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.danger { color: var(--bad); }
.btn.link { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 500; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.msg { font-size: .84rem; }
.msg.bad { color: var(--bad); }
.msg.good { color: var(--good); }
.scroll { overflow-x: auto; }
select.inp, input.inp { font: inherit; font-size: .86rem; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line2); vertical-align: top; }
th { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; border-bottom-color: var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
td.num, th.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--bg); }
.bar { height: 5px; border-radius: 3px; background: var(--line2); overflow: hidden; min-width: 50px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.over i { background: var(--bad); }
.bar.near i { background: #c48a00; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .76rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid rgba(0,0,0,.08); }
.legend i.conf { background: #fff; border: 2px solid var(--bad); }
.legend i.offday { background: repeating-linear-gradient(135deg, var(--t-prac) 0 4px, #fff 4px 8px); }
.legend i.lunchk { background: var(--lunch); }
.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
.list { display: grid; gap: 1px; max-height: 70vh; overflow-y: auto; }
.listgrp { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; padding: 8px 8px 2px; }
.item { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: .88rem; border: 0; background: transparent; color: var(--ink); padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.item:hover { background: var(--bg); }
.item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.item small { color: var(--muted); font-family: var(--f-mono); font-size: .72rem; }
dl.about { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; font-size: .88rem; }
dl.about dt { color: var(--muted); }
dl.about dd { margin: 0; }
.headrow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: start; gap: 8px; }

/* ----- dashboard ----- */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; display: grid; gap: 3px; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.kpi:hover { border-color: var(--accent); }
.kpi .l { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; }
.kpi .v { font-family: var(--f-display); font-weight: 700; font-size: 1.55rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: .85rem; color: var(--muted); font-weight: 500; margin-left: 4px; }
.kpi .s { font-size: .78rem; color: var(--muted); }
.kpi.alert .v { color: var(--bad); }
.dash { display: grid; grid-template-columns: minmax(0, 1fr) 316px; gap: 14px; align-items: start; }
.bottom { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.tablebox { max-height: 330px; overflow: auto; }
.queue { max-height: 720px; overflow-y: auto; display: grid; gap: 8px; align-content: start; }
.queue details > summary { cursor: pointer; font-family: var(--f-display); font-weight: 500; font-size: .86rem; padding: 4px 0; display: flex; justify-content: space-between; }
.qlist { display: grid; gap: 4px; margin-top: 4px; }
.qi { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; text-align: left; font: inherit; font-size: .8rem; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; cursor: grab; color: var(--ink); }
.qi:hover { border-color: var(--accent); }
.qi:active { cursor: grabbing; }
.qi .grip { width: 8px; height: 16px; background-image: radial-gradient(var(--muted) 1.2px, transparent 1.3px); background-size: 4px 4px; opacity: .6; }
.qi b { font-family: var(--f-mono); font-size: .76rem; }
.qi .m { display: block; color: var(--muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qi .h { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); text-align: right; }
.pat { font-size: .68rem; font-weight: 500; padding: 1px 6px; border-radius: 4px; background: var(--lunch); color: var(--ink); margin-left: 4px; }
.loads td { padding: 5px 6px; }
.loads td:first-child { min-width: 150px; }
.heat td, .heat th { padding: 3px 4px; text-align: center; }
.heat th:first-child, .heat td:first-child { text-align: left; white-space: nowrap; font-family: var(--f-mono); font-size: .74rem; }
.heat td.h { font-family: var(--f-mono); font-size: .7rem; min-width: 34px; border: 2px solid var(--panel); border-radius: 4px; }
.conf-list { display: grid; gap: 6px; }
.conf-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 7px 9px; border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: 6px; font-size: .82rem; }
.conf-item.warn { border-left-color: #c48a00; }
.conf-item .ty { font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--bad); }
.conf-item.warn .ty { color: var(--warn); }
.empty { color: var(--muted); font-size: .86rem; padding: 6px 0; }

/* ----- week grid ----- */
.week { display: grid; grid-template-columns: 46px repeat(var(--days), minmax(96px, 1fr)); min-width: 660px; padding-bottom: 8px; }
.dayhead { font-family: var(--f-display); font-weight: 500; font-size: .82rem; text-align: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.dayhead.off { color: var(--t-prac-ink); }
.times { position: relative; }
.times span { position: absolute; right: 6px; transform: translateY(-50%); font-family: var(--f-mono); font-size: .64rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.col { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px), linear-gradient(to bottom, var(--line2) 1px, transparent 1px); background-size: 100% calc(var(--row) * 2), 100% var(--row); }
.col.off { background-color: transparent; background-image: repeating-linear-gradient(135deg, var(--t-prac) 0 6px, transparent 6px 14px); }
.col.drop { background-color: var(--accent-soft); }
.lunch { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--lunch) 0 6px, #e4e7ec 6px 8px); display: flex; align-items: center; justify-content: center; gap: 4px; font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); z-index: 1; }
.away { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; font-size: .74rem; color: var(--t-prac-ink); font-weight: 500; }
.block { position: absolute; z-index: 2; border-radius: 5px; padding: 4px 6px; overflow: hidden; font-size: .72rem; line-height: 1.25; border: 1px solid rgba(0,0,0,.06); text-align: left; font-family: var(--f-body); cursor: pointer; }
.block strong { display: flex; gap: 3px; align-items: center; font-family: var(--f-mono); font-size: .7rem; font-weight: 500; }
.block span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.block .ttl { opacity: .85; }
.block strong { white-space: nowrap; }
.block strong .code { flex: none; }
.block strong .sec { font-family: var(--f-body); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.block.other { opacity: .5; }
.block.sel { box-shadow: 0 0 0 2px var(--accent); }

// ===== Submitting a department schedule (hosted version) =====

// booked after the lending departments submit, and GE Department courses are left out.
function missingFor(dept) {
  const out = [];
  DATA.classes.filter((c) => progDept(c.section) === dept && ["major", "own"].includes(classKind(c)) && c.meetings.length).forEach((c) => {
    const issues = [];
    c.meetings.forEach((m) => {
      const b = bookings[`${c.id}|${m.part}`];
      if (!b) issues.push(`${PART[m.part].toLowerCase()} has no time`);
      else if (m.pools.some((p) => p) && !b.room) issues.push(`${PART[m.part].toLowerCase()} has no room`);
    });
    if (!teacherOf(c)) issues.push("no teacher");
    if (issues.length) out.push({ cls: c, issues });
  });
  return out;
}
// Borrowed GE classes of a department still without an approved instructor from another department.
function waitingFor(dept) {
  return DATA.classes.filter((c) => progDept(c.section) === dept && classKind(c) === "borrowed")
    .map((c) => ({ cls: c, a: approvalOf(c) || { state: "unscheduled" } })).filter((x) => x.a.state !== "approved");
}
// A short description: "2 SOCS 195 classes waiting for Economics, 1 HIST 201 class not asked yet".
function waitingText(list) {

  list.forEach(({ cls, a }) => {
    const what = a.state === "unscheduled" ? "not booked yet" : a.state === "unasked" ? "booked without an instructor" : a.state === "rejected" ? `not approved by ${a.dept}` : `waiting for ${a.dept}`;
    const k = `${cls.course}|${what}`;
    groups[k] = (groups[k] || 0) + 1;
  });
  return Object.entries(groups).map(([k, n]) => { const [course, what] = k.split("|"); return `${n} ${course} class${n > 1 ? "es" : ""} ${what}`; }).join(", ");
}

function editor(cls, part) {

    else if (hf === 0) { chip = `<span class="chip bad">No instructor</span>`; why = askable(cls, null).some((x) => x.submitted) ? "No instructor of a submitted department is free then" : `No department that teaches ${cls.course} has submitted yet`; }
    else if (ev.length) { chip = `<span class="chip warn">Check</span>`; why = ev[0][1]; }
    else { chip = `<span class="chip good">Free</span>`; why = [rooms > 0 ? `${rooms} room${rooms > 1 ? "s" : ""} free` : "No room needed", hf > 0 && ask.map((x) => `${x.dept} ${x.free.length}`).join(", ") + " free"].filter(Boolean).join(" · "); }
    const when = `${o.iv.map((i) => i[0]).join("/")} ${hm(o.iv[0][1])}–${hm(o.iv[0][2])}`;
    return { o, html: `<button type="button" class="opt${d.pattern === o.label ? " on" : ""}" data-opt="${esc(o.label)}"><b>${esc(o.label)}</b><span><span class="small">${when}</span><span class="why">${esc(why)}</span></span>${chip}</button>`, group: o.ex ? "Outside the time frame (needs approval)" : o.label.includes("TTh") || ["Tue", "Thu"].includes(o.iv[0][0]) ? "Tuesday / Thursday" : o.iv[0][0] === "Sat" ? "Saturday" : "Monday / Wednesday / Friday" };
  });
  const groups = {};
  rows.forEach((r) => (groups[r.group] = groups[r.group] || []).push(r.html));
  const optHtml = Object.entries(groups).map(([g, list]) => `<div class="optgrp">${esc(g)}</div>${list.join("")}`).join("");
  const opt = d.pattern && findOpt(m.kind, d.pattern);
  let detail = "";
  if (opt) {
    const rooms = homeFirst(cls, roomsFor(m));
    const free = new Set(freeRooms(cls, m, opt));
    const roomSel = m.pools.some((p) => p) ? `<label for="roomSel">Room
      <select id="roomSel"><option value="">Choose a room</option>${rooms.map((r) => `<option value="${esc(r)}"${r === d.room ? " selected" : ""}>${esc(r)} · ${free.has(r) ? "free" : "booked"}${DATA.rooms[r].lab ? " · " + DATA.rooms[r].lab.replace(/_/g, " ") : ""}${DATA.rooms[r].pool === "shared" ? " · overflow" : ""}</option>`).join("")}</select></label>`
      : `<p class="small muted">${m.kind === "nstp" ? "CWTS meets on the campus grounds; no room is booked." : "Practicum supervision: no room is booked."}</p>`;
    const ft = freeTeachers(cls, m, opt).filter((x) => teacherAllowed(cls, x.key));
    const dept = t?.key ? DATA.teachers[t.key].dept : "";
    const usual = (course.usual || "").replace(/^GE Department$/, "General Education");
    const near = ft.filter((x) => { const td = DATA.teachers[x.key].dept; return td === dept || (usual && usual.includes(td)); });
    const ftSorted = ft.slice().sort((x, y) => (y.key === cls.planTeacher) - (x.key === cls.planTeacher));
    teacherChoices = { free: ftSorted.map((x) => ({ key: x.key, text: `${DATA.teachers[x.key].name} · ${DATA.teachers[x.key].dept} · ${luFor(x.key)}/${DATA.teachers[x.key].max} LU${x.full ? " (at load)" : ""}${x.key === cls.planTeacher && isGE(cls.course) ? " · loading plan" : ""}` })),
                       busy: teacherKey && !ft.some((x) => x.key === teacherKey) ? teacherKey : null, selected: teacherKey };
    const teacherSel = borrowed && tRight ? "" : tRight ? `<div style="display:grid;gap:4px"><span class="fieldlabel">Teacher</span>
      <div class="readonly">${esc(borrowed && (!teacherKey || DATA.teachers[teacherKey].dept !== d.askDept) ? "Not yet chosen" : teacherKey ? DATA.teachers[teacherKey].name : "Not yet chosen")}${!borrowed && teacherKey && t?.key === cls.teacher ? " (loading plan)" : ""}${tRight !== right ? `<br><span class="small muted">${esc(tRight.replace(/^View only: /, ""))}</span>` : ""}</div></div>`
      : `<div style="display:grid;gap:4px"><label for="teacherSel">Teacher (from the loading plan${t?.key ? `: ${esc(DATA.teachers[t.key].name)}` : ": none"})</label>

    const checks = evaluate(cls, m, opt, d.room || null, checkTeacher);
    let askSel = "";
    if (borrowed && tRight) {
      // Book together with an instructor of a department that has submitted, free at this time and
      // under their load limit. If nobody is available at any time, a department can be asked for one.
      const list = askable(cls, opt);
      const full = (k) => luFor(k) + cls.lu > DATA.teachers[k].max;
      const avail = list.filter((x) => x.submitted).flatMap((x) => x.free.filter((k) => !full(k)));
      const anyTime = optionsFor(m.kind).filter((o) => !o.ex).some((o) => askable(cls, o).some((x) => x.submitted && x.free.some((k) => !full(k))));
      const val = d.askDept && d.askTeacher ? `${d.askDept}|${d.askTeacher}` : "";
      const openReq = !anyTime ? list.map((x) =>
        `<option value="${esc(x.dept)}|*"${`${x.dept}|*` === val ? " selected" : ""}>Request an instructor from ${esc(x.dept)} (${esc(x.college)})</option>`).join("") : "";
      askSel = `<label for="askSel" style="grid-column:span 2">Instructor (from a department that teaches ${esc(cls.course)})

              `<option value="${esc(x.dept)}|${k}"${`${x.dept}|${k}` === val ? " selected" : ""}${full(k) ? " disabled" : ""}>${esc(DATA.teachers[k].name)} · ${luFor(k)}/${DATA.teachers[k].max} LU${full(k) ? " · full load" : ""}${k === cls.planTeacher ? " · loading plan" : ""}</option>`).join("")}</optgroup>`).join("")}

      const pick = list.find((x) => x.dept === d.askDept);
      if (!list.some((x) => x.submitted)) checks.push(["bad", `No department that teaches ${cls.course} has submitted yet, so it cannot be booked. Submit your own part; the bell tells you when one submits.`]);
      else if (!d.askTeacher) checks.push(["bad", avail.length ? `Choose the instructor: a borrowed GE class is booked together with its instructor`
        : anyTime ? `No instructor is free and under load at ${opt.label}. Choose another time (the times marked Free have one).`
        : `No instructor is free at any time. Choose “Request an instructor” to ask a department to find one.`]);
      else if (d.askTeacher === "*") checks.push(["info", `This sends a request to ${d.askDept} and the Registrar for an instructor. Nothing is booked yet; book the class once they tell you someone is free.`]);
      else if (!pick?.submitted) checks.push(["bad", `${d.askDept} has not submitted its schedule yet`]);
      else if (!pick.free.includes(d.askTeacher)) checks.push(["bad", `${DATA.teachers[d.askTeacher].name} is not free at ${opt.label}`]);
      else checks.push(["good", `${DATA.teachers[d.askTeacher].name} (${d.askDept}) is free at ${opt.label}. Booking holds this time for them until ${d.askDept} approves.`]);
      const last = approvals[cls.id], ir = instrRequests[cls.id];
      if (last?.rejected_at && !b) checks.push(["warn", `Last booking was not approved by ${last.department}${last.note ? `: “${last.note}”` : ""}. Choose another instructor or time.`]);
      if (ir) checks.push(["info", `You asked ${ir.department} for an instructor on ${new Date(ir.requested_at).toLocaleDateString("en-US", { month: "short", day: "numeric" })}${ir.note ? ` (“${ir.note}”)` : ""}.`]);
    }
    if (teacherKey) {

        const capped = L.capped + (!INTRO.has(cls.course) && !isGE(cls.course) ? 1 : 0);

      const cur = approvalOf(cls), r = requestOf(cls);
      const askDept = d.askDept || r?.department;

        ${(near.length ? near : ft).length > 14 ? `<span>+${(near.length ? near : ft).length - 14} more in the list</span>` : ""}</div></div>`}
      <ul class="checks">${checks.length ? checks.map(([l, txt]) => `<li class="${l}">${esc(txt)}</li>`).join("") : `<li class="good">No conflicts. Students, teacher, and room are all free.</li>`}</ul>
      <div class="actions">${borrowed && tRight && d.askTeacher === "*" ? `<button type="button" class="btn primary" data-act="askinstr">Send instructor request</button>`

        ${b ? `<button type="button" class="btn danger" data-act="remove"${canWrite && !right ? "" : " disabled"}>Remove booking</button>` : ""}
        <button type="button" class="btn" data-act="close">Close</button><span class="msg" id="msg"></span></div>`;
  }
  return `<div class="editor"><div><h3>${esc(cls.course)} ${esc(PART[part])} · ${esc(cls.section)}</h3>

// Teacher dropdown in the booking form, filtered by the search box.
let teacherChoices = { free: [], busy: null, selected: "" };
let teacherQuery = "";
function teacherOptions() {
  const q = teacherQuery.trim().toLowerCase();
  const match = (txt) => !q || txt.toLowerCase().includes(q);
  const sel = teacherChoices.selected;
  const free = teacherChoices.free.filter((x) => match(x.text) || x.key === sel);
  let html = `<option value="">No teacher yet</option>`;
  html += `<optgroup label="Free at this time${q ? ` · matching “${esc(teacherQuery.trim())}”` : ""}">${free.map((x) =>
    `<option value="${x.key}"${x.key === sel ? " selected" : ""}>${esc(x.text)}</option>`).join("")}</optgroup>`;
  if (teacherChoices.busy) html += `<optgroup label="Busy at this time"><option value="${teacherChoices.busy}" selected>${esc(DATA.teachers[teacherChoices.busy].name)}</option></optgroup>`;
  const count = teacherChoices.free.filter((x) => match(x.text)).length;
  setTimeout(() => { const c = $("teacherCount"); if (c) c.textContent = q ? `${count} of ${teacherChoices.free.length} free teachers match` : `${teacherChoices.free.length} teachers free at this time`; });
  return html;
}

function instrRequestCard() {

        <td class="small">${esc(r.note || "")}</td><td class="small">${new Date(r.requested_at).toLocaleDateString("en-US", { month: "short", day: "numeric" })}<div class="muted">${esc((r.requested_by || "").split("@")[0])}</div></td>
        <td><button type="button" class="btn" data-closeinstr="${esc(r.class_id)}">Close</button></td></tr>`; }).join("")}</tbody></table></div></div>`;

async function decide(cid, decision) {
  let note = null, teacher = null;
  if (decision === "reject") { note = window.prompt("Reason (shown to the department that booked it):", ""); if (note === null) return false; }
  if (decision === "approve") {
    const sel = $(`apT-${cid}`);
    teacher = sel ? sel.value || null : null;
    if (sel && !teacher) { toast(`Choose a teacher for ${CLASS[cid].course} ${CLASS[cid].section} first.`); return false; }
  }
  const { error } = await sb.rpc("decide_ge", { cid, decision, note, teacher });
  if (error) { toast(sbMessage(error)); return false; }
  return true;
}

// ---------- actions ----------
function openPick(clsId, part) {
  const cls = CLASS[clsId];
  if (!cls) return;
  const b = bookings[`${clsId}|${part}`];
  const m = cls.meetings.find((x) => x.part === part);
  state.pick = { cls: clsId, part };
  teacherQuery = "";
  const t = teacherOf(cls);
  state.draft = { pattern: b?.pattern || (m.kind === "nstp" ? optionsFor("nstp")[0]?.label : null), room: b?.room || "", teacher: t?.key || "", askDept: "", askTeacher: "" };
  if (classKind(cls) === "borrowed" && requestOf(cls)) {    // the instructor asked before
    state.draft.askDept = requestOf(cls).department; state.draft.askTeacher = t?.key || "*";
  }
  // Jump to the class's own section on the booking desk.
  const sec = DATA.sections[cls.section];
  state.view = "timetable"; state.college = DATA.programs[sec.program].college; state.program = sec.program; state.section = cls.section;
  if (state.scope !== "ALL" && state.scope !== "GE" && state.scope !== state.college) state.scope = "ALL";
  if (state.scope === "GE") state.scope = "ALL";
}
function choosePattern(label) {
  state.draft.pattern = label;
  const cls = CLASS[state.pick.cls]; const m = cls.meetings.find((x) => x.part === state.pick.part);
  const opt = findOpt(m.kind, label);
  if (state.draft.room && !freeRooms(cls, m, opt).includes(state.draft.room)) state.draft.room = "";
  if (!state.draft.room && m.pools.some((p) => p)) state.draft.room = homeFirst(cls, freeRooms(cls, m, opt))[0] || "";
  if (classKind(cls) === "borrowed" && state.draft.askTeacher && state.draft.askTeacher !== "*") {   // keep the instructor only if still free then
    const pick = askable(cls, opt).find((x) => x.dept === state.draft.askDept);
    if (!pick?.submitted || !pick.free.includes(state.draft.askTeacher)) { state.draft.askDept = ""; state.draft.askTeacher = ""; }
  }
}
function openSection(s) {
  const sec = DATA.sections[s];
  state.view = "timetable"; state.pick = null; state.draft = null;
  state.college = DATA.programs[sec.program].college; state.program = sec.program; state.section = s;
  if (state.scope !== "ALL" && state.scope !== state.college) state.scope = "ALL";
}
// A class dropped on the dashboard timetable: open it at the allowed time that starts nearest the drop point.
function dropAt(clsId, part, day, minute) {
  const cls = CLASS[clsId]; const m = cls?.meetings.find((x) => x.part === part);
  if (!m) return;
  const fits = optionsFor(m.kind).filter((o) => o.iv.some(([d, s, e]) => d === day && s <= minute && minute < e))
    .sort((a, b) => (a.ex ? 1 : 0) - (b.ex ? 1 : 0) || Math.abs(a.iv.find((i) => i[0] === day)[1] - minute) - Math.abs(b.iv.find((i) => i[0] === day)[1] - minute));
  openPick(clsId, part);
  if (fits.length) choosePattern(fits[0].label);
  else toast(`No allowed time for ${cls.course} ${PART[part].toLowerCase()} on ${day} at ${hm(minute)}. Choose one from the list.`);
}
let toastTimer = null;
function toast(text) { const t = $("toast"); t.textContent = text; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 4200); }
async function save() {
  const cls = CLASS[state.pick.cls], part = state.pick.part, d = state.draft;
  const msg = $("msg");
  if (sb) {
    try {
      if ((d.teacher || "") !== (teacherOf(cls)?.key || "")) {
        const r = (d.teacher || "") === (cls.teacher || "")
          ? await sb.from("teacher_changes").delete().eq("class_id", cls.id)
          : await sb.from("teacher_changes").upsert({ class_id: cls.id, sem: DATA.semester, teacher: d.teacher || null });
        if (r.error) throw r.error;
      }
      if (classKind(cls) === "borrowed" && !isAdmin() || classKind(cls) === "borrowed" && d.askTeacher && d.askTeacher !== "*") {
        const q = await sb.rpc("book_borrowed", { cid: cls.id, meeting: part, slot: d.pattern, place: d.room || null, d: d.askDept, t: d.askTeacher });
        if (q.error) throw q.error;
      } else {
        const r = await sb.from("bookings").upsert({ class_id: cls.id, part, sem: DATA.semester, pattern: d.pattern, room: d.room || null });
        if (r.error) throw r.error;
      }
      await Promise.all([sbLoad.bookings(), sbLoad.teacher_changes(), sbLoad.ge_requests(), sbLoad.ge_decisions(), sbLoad.instructor_requests()]);
      rebuild(); render();
      const m2 = $("msg"); if (m2) { m2.textContent = "Saved."; m2.className = "msg good"; }
    } catch (err) { const m2 = $("msg") || msg; if (m2) { m2.textContent = sbMessage(err); m2.className = "msg bad"; } const b = document.querySelector('[data-act="save"]'); if (b) b.disabled = false; }
    return;
  }
  const me = user ? await user.id() : null;
  try {
    const plan = cls.teacher || "";
    if ((d.teacher || "") !== (teacherOf(cls)?.key || "")) {
      if ((d.teacher || "") === plan) await store.collection("teachers").doc(docId(DATA.semester, cls.id)).delete();
      else await store.collection("teachers").doc(docId(DATA.semester, cls.id)).set({ sem: DATA.semester, class: cls.id, course: cls.course, section: cls.section, teacher: d.teacher || null, by: me, at: new Date().toISOString() });
    }
    await store.collection("bookings").doc(docId(DATA.semester, cls.id, part)).set({ sem: DATA.semester, class: cls.id, course: cls.course,
      section: cls.section, part, pattern: d.pattern, room: d.room || null, by: me, at: new Date().toISOString() });
    if (!shared) savedAt.bookings = new Date().toISOString();
    const m2 = $("msg"); if (m2) { m2.textContent = "Saved."; m2.className = "msg good"; }
  } catch (err) {
    if (msg) { msg.textContent = err?.code === "invalid_argument" ? "You have view-only access, so bookings can't be saved." : "Could not save. Try again."; msg.className = "msg bad"; }
  }
}
async function removeBooking() {
  const cls = CLASS[state.pick.cls];
  if (sb && classKind(cls) === "borrowed") {
    const { error } = await sb.rpc("unbook_borrowed", { cid: cls.id });
    if (error) { const msg = $("msg"); if (msg) { msg.textContent = sbMessage(error); msg.className = "msg bad"; } return; }
    await Promise.all([sbLoad.bookings(), sbLoad.teacher_changes(), sbLoad.ge_requests(), sbLoad.ge_decisions()]);
    state.draft.pattern = null; rebuild(); render(); return;
  }
  if (sb) {
    const { data, error } = await sb.from("bookings").delete().eq("class_id", cls.id).eq("part", state.pick.part).select();
    if (error || !data?.length) { const msg = $("msg"); if (msg) { msg.textContent = error ? sbMessage(error) : "Your role can't change this class."; msg.className = "msg bad"; } return; }
    await sbLoad.bookings(); state.draft.pattern = null; rebuild(); render(); return;
  }
  try { await store.collection("bookings").doc(docId(DATA.semester, cls.id, state.pick.part)).delete(); state.draft.pattern = null; render(); }
  catch (err) { const msg = $("msg"); if (msg) { msg.textContent = "Could not remove. Try again."; msg.className = "msg bad"; } }
}

// ---------- publishing ----------
function openPublish() {
  const bad = conflicts.filter((c) => c.sev === "bad").length;
  const done = Object.keys(bookings).length;
  const el = $("publishPanel");
  el.hidden = false;
  el.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pubTitle">
    <h2 id="pubTitle">Publish the 1st semester schedule</h2>
    <p style="margin:0">Publishing marks the current bookings as the official schedule for SY ${esc(printCfg.ay)}. You can keep editing; the footer then shows it as a draft again until you publish once more.</p>
    <ul class="checks">
      <li class="${done === totalMeetings ? "good" : "warn"}">${done} of ${totalMeetings} class meetings are booked${done === totalMeetings ? "" : ` · ${totalMeetings - done} still unscheduled`}</li>
      <li class="${bad ? "bad" : "good"}">${bad ? `${bad} open conflicts across all colleges` : "No open conflicts"}</li>
      <li class="${Object.values(loads).some((L) => L.status === "over") ? "warn" : "good"}">${Object.values(loads).filter((L) => L.status === "over").length} faculty over their limit</li>
      ${BACKEND ? (() => { const n = DATA.classes.filter((c) => approvalOf(c)?.state === "pending").length; return `<li class="${n ? "warn" : "good"}">${n ? `${n} borrowed GE classes still waiting for approval` : "Every borrowed GE class is approved"}</li>`; })() : ""}</ul>
    <div class="actions"><button type="button" class="btn primary" data-pub="go">${bad ? `Publish with ${bad} conflicts` : "Publish"}</button>
      <button type="button" class="btn" data-pub="cancel">Cancel</button><span class="msg" id="pubmsg"></span></div></div>`;
}
async function publish() {
  if (sb) {
    const { error } = await sb.rpc("publish_schedule");
    if (error) { const m = $("pubmsg"); if (m) { m.textContent = sbMessage(error); m.className = "msg bad"; } return; }
    await sbLoad.settings(); $("publishPanel").hidden = true; toast("Schedule published."); render(); return;
  }
  const me = user ? await user.id() : null;
  try {
    await store.collection("status").doc(`sem${DATA.semester}`).set({ sem: DATA.semester, published: true, at: new Date().toISOString(), by: me,
      ay: printCfg.ay, meetings: Object.keys(bookings).length, conflicts: conflicts.filter((c) => c.sev === "bad").length });
    $("publishPanel").hidden = true; toast("Schedule published.");

// ---------- search ----------
const SEARCH = [].concat(
  Object.keys(DATA.sections).map((s) => ({ kind: "Section", label: s, sub: DATA.programs[DATA.sections[s].program].name, go: () => openSection(s) })),
  Object.entries(DATA.teachers).map(([k, t]) => ({ kind: "Faculty", label: t.name, sub: `${t.dept} · ${t.college}`, go: () => { state.view = "faculty"; state.teacher = k; if (!teacherInScope(k)) state.scope = "ALL"; } })),
  Object.entries(DATA.rooms).map(([n, r]) => ({ kind: "Room", label: n, sub: `${roomKind(r)} · ${DATA.buildings[r.building] || r.building}`, go: () => { state.view = "rooms"; state.room = n; if (!roomInScope(n)) state.scope = "ALL"; } })),
  [...new Set(DATA.classes.map((c) => c.course))].map((code) => ({ kind: "Course", label: `${code} ${DATA.courses[code].title}`, sub: `${DATA.classes.filter((c) => c.course === code).length} sections`,
    go: () => { const c = DATA.classes.find((x) => x.course === code); if (isGE(code)) { state.scope = "GE"; state.view = "courses"; } else { state.scope = "ALL"; state.view = "courses"; state.program = DATA.sections[c.section].program; } } })),
);
let searchHits = [], searchOn = 0;
function runSearch(q) {
  const box = $("results");
  q = q.trim().toLowerCase();
  if (!q) { box.hidden = true; return; }
  const words = q.split(/\s+/);
  searchHits = SEARCH.filter((x) => words.every((w) => `${x.label} ${x.sub}`.toLowerCase().includes(w))).slice(0, 14);
  searchOn = 0;
  box.hidden = false;
  box.innerHTML = searchHits.length ? searchHits.map((x, i) => `<button type="button" data-hit="${i}" class="${i === 0 ? "on" : ""}"><small>${x.kind}</small><span>${esc(x.label)}<em>${esc(x.sub)}</em></span></button>`).join("")
    : `<p class="empty" style="padding:8px">No matches.</p>`;
}
function goHit(i) { const h = searchHits[i]; if (!h) return; h.go(); if (!allowedScopes().includes(state.scope)) state.scope = allowedScopes()[0]; state.pick = null; $("results").hidden = true; $("search").value = ""; render(); window.scrollTo(0, 0); }

// ---------- events ----------
document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button, tr[data-goteacher], tr[data-goroom]");
  if (!ev.target.closest(".search")) $("results").hidden = true;
  if (!ev.target.closest("#exportMenu")) $("exportMenu")?.removeAttribute("open");
  if (flyKey && !ev.target.closest("#flyout, [data-flyout]")) { flyKey = null; $("flyout").hidden = true; document.querySelectorAll("[data-flyout]").forEach((b) => b.setAttribute("aria-expanded", "false")); }
  if (userMenuOpen && !ev.target.closest("#userchip")) { userMenuOpen = false; renderShell(); }

  if (ds.usermenu) { userMenuOpen = !userMenuOpen; renderShell(); return; }
  if (ds.openpublish) { openPublish(); return; }
  if (ds.view) { flyKey = null; userMenuOpen = false; }
  if (ds.hit) { goHit(+ds.hit); return; }
  if (ds.auth) { if (ds.auth === "signout") { await sb.auth.signOut(); return; } showLogin(ds.auth); return; }
  if (ds.decide) {

  if (ds.decideall) {

  if (ds.submit) { openSubmit(ds.submit); return; }

  }
  if (ds.subgo) { t.disabled = true; await doSubmit(ds.subgo); t.disabled = false; return; }
  if (ds.subcancel) { $("submitPanel").hidden = true; return; }
  if (ds.geremove) {

  }
  if (ds.pub) { if (ds.pub === "go") { t.disabled = true; await publish(); } else $("publishPanel").hidden = true; return; }
  if (t.id === "publishBtn") { openPublish(); return; }
  if (ds.export) { $("exportMenu")?.removeAttribute("open"); if (ds.export === "xlsx") exportExcel(); else { state.view = "reports"; render(); } return; }
  if (ds.view) { state.view = ds.view; state.pick = null; state.draft = null; }
  else if (ds.college) { state.college = ds.college; state.program = null; state.pick = null; }
  else if (ds.program) { state.program = ds.program; state.section = null; state.pick = null; }
  else if (ds.section) { state.section = ds.section; state.pick = null; }
  else if (ds.teacher) { state.teacher = ds.teacher; }

});

document.addEventListener("drop", (ev) => {
  const col = ev.target.closest?.("[data-drop]");

  if (!col) return;
  ev.preventDefault();
  const [clsId, part] = (ev.dataTransfer.getData("text/plain") || "").split("|");
  if (!CLASS[clsId]) return;
  const r = col.getBoundingClientRect();
  const rows = (DATA.end - DATA.start) / DATA.slot;
  const minute = DATA.start + Math.max(0, Math.min(rows - 1, Math.floor(((ev.clientY - r.top) / r.height) * rows))) * DATA.slot;
  dropAt(clsId, part, col.dataset.drop, minute);
  render(); window.scrollTo(0, 0);
});

function drawSheet(doc, sheet) {
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 40;
  let y = M;
  doc.setTextColor(0); doc.setDrawColor(0);
  const center = (text, size, style = "normal") => { doc.setFont("times", style); doc.setFontSize(size); doc.text(text, W / 2, y, { align: "center" }); };
  if (printCfg.university) { center(printCfg.university.toUpperCase(), 14, "bold"); y += 16; }
  if (printCfg.office) { center(printCfg.office, 11); y += 15; }
  y += 4;
  center(sheet.title, 13, "bold"); y += 14;
  center(`First Semester, Academic Year ${printCfg.ay}`, 10.5, "italic"); y += 9;
  doc.setLineWidth(0.8); doc.line(M, y, W - M, y); doc.setLineWidth(0.3); doc.line(M, y + 2.5, W - M, y + 2.5);
  y += 16;
  // Information block, two columns.
  doc.setFontSize(10);
  const colW = (W - 2 * M) / 2;
  for (let i = 0; i < sheet.info.length; i += 2) {      // label/value pairs, two per line, values wrap
    let lines = 1;
    [sheet.info[i], sheet.info[i + 1]].forEach((pair, j) => {
      if (!pair) return;
      const x = M + j * colW, wrapped = doc.splitTextToSize(String(pair[1]), colW - 118);
      doc.setFont("times", "bold"); doc.text(`${pair[0]}:`, x, y);
      doc.setFont("times", "normal"); doc.text(wrapped, x + 112, y);
      lines = Math.max(lines, wrapped.length);
    });
    y += lines * 12 + 2;
  }
  y += 2;
  // Class list.
  doc.autoTable({
    startY: y, head: [sheet.head], body: sheet.rows.length ? sheet.rows : [[{ content: "No classes scheduled.", colSpan: sheet.head.length }]],
    theme: "grid", margin: { left: M, right: M },
    styles: { font: "times", fontSize: 8.5, textColor: 0, lineColor: 0, lineWidth: 0.4, cellPadding: 3, valign: "top" },
    headStyles: { fillColor: [255, 255, 255], textColor: 0, fontStyle: "bold", halign: "center", lineWidth: 0.6 },
    columnStyles: Object.fromEntries(sheet.widths.map((w, i) => [i, w ? { cellWidth: w } : {}])),
  });
  y = doc.lastAutoTable.finalY + 14;
  // Weekly timetable grid.
  const rows = (DATA.end - DATA.start) / DATA.slot;
  const signH = 52;
  let rowH = Math.min(15, (H - M - signH - y - 22) / rows);
  if (rowH < 10) { doc.addPage(); y = M; center(`${sheet.title} (continued): ${sheet.name}`, 10.5, "bold"); y += 16; rowH = Math.min(20, (H - M - signH - y - 22) / rows); }
  doc.setFont("times", "bold"); doc.setFontSize(10); doc.text("Weekly timetable", M, y); y += 6;
  const timeW = 62, dayW = (W - 2 * M - timeW) / DAYS.length, top = y + 14;
  doc.setLineWidth(0.6); doc.rect(M, y, W - 2 * M, 14 + rows * rowH);
  doc.setFontSize(9);
  doc.text("Time", M + timeW / 2, y + 10, { align: "center" });
  DAYS.forEach((d, i) => doc.text({ Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday" }[d], M + timeW + dayW * (i + 0.5), y + 10, { align: "center" }));
  doc.line(M, top, W - M, top);
  doc.setLineWidth(0.2); doc.setDrawColor(150);
  for (let r = 1; r < rows; r++) doc.line(M + timeW, top + r * rowH, W - M, top + r * rowH);
  doc.setDrawColor(0); doc.setLineWidth(0.4);
  for (let i = 0; i <= DAYS.length; i++) doc.line(M + timeW + dayW * i, y, M + timeW + dayW * i, top + rows * rowH);
  doc.setFont("times", "normal"); doc.setFontSize(7.5);
  for (let r = 0; r < rows; r++) {
    const m = DATA.start + r * DATA.slot;
    if (r % 2 === 0) { doc.text(`${hm(m)}–${hm(m + 60)}`, M + timeW / 2, top + r * rowH + rowH * 0.75, { align: "center" }); doc.setDrawColor(0); doc.setLineWidth(0.3); if (r) doc.line(M, top + r * rowH, M + timeW, top + r * rowH); }
  }
  const yOf = (m) => top + ((m - DATA.start) / DATA.slot) * rowH;
  doc.setFont("times", "italic"); doc.setFontSize(7.5);
  DAYS.forEach((d, i) => {
    const x = M + timeW + dayW * i;
    if (sheet.off.includes(d)) {
      doc.setFillColor(255, 255, 255); doc.rect(x + 0.4, top + 0.4, dayW - 0.8, rows * rowH - 0.8, "F");
      doc.text("Practicum placement", x + dayW / 2, top + rows * rowH / 2, { align: "center" }); return;
    }
    if (LUNCH[d]) {          // a clear band, no grid lines, labelled
      const y1 = yOf(LUNCH[d][0]), y2 = yOf(LUNCH[d][1]);
      doc.setFillColor(255, 255, 255); doc.rect(x + 0.4, y1 + 0.3, dayW - 0.8, y2 - y1 - 0.6, "F");
      doc.setDrawColor(0); doc.setLineWidth(0.2); doc.setLineDashPattern([1.5, 1.5], 0);
      doc.line(x, y1, x + dayW, y1); doc.line(x, y2, x + dayW, y2); doc.setLineDashPattern([], 0);
      doc.text("LUNCH BREAK", x + dayW / 2, (y1 + y2) / 2 + 2.5, { align: "center" });
    }
  });
  DAYS.forEach((d, i) => {
    const day = sheet.sessions.filter((s) => s.day === d).sort((a, b) => a.start - b.start);
    const lanes = [];
    day.forEach((s) => { let k = lanes.findIndex((e) => e <= s.start); if (k < 0) { k = lanes.length; lanes.push(0); } lanes[k] = s.end; s._pl = k; });
    day.forEach((s) => {
      const n = Math.max(1, day.filter((o) => o.start < s.end && s.start < o.end).reduce((a, o) => Math.max(a, o._pl + 1), 0));
      const w = dayW / n, x = M + timeW + dayW * i + s._pl * w, y1 = yOf(s.start), h = yOf(s.end) - y1;
      doc.setFillColor(255, 255, 255); doc.setDrawColor(0); doc.setLineWidth(0.7);
      doc.rect(x + 1.2, y1 + 1, w - 2.4, h - 2, "FD");
      const lines = sheet.cell(s).filter(Boolean);
      const maxLines = Math.max(1, Math.floor((h - 3) / 8));
      lines.slice(0, maxLines).forEach((ln, j) => {
        doc.setFont("times", j === 0 ? "bold" : "normal"); doc.setFontSize(j === 0 ? 7.5 : 7);
        doc.text(doc.splitTextToSize(ln, w - 5)[0], x + w / 2, y1 + 8.5 + j * 8, { align: "center" });
      });
    });
  });
  // Signatures.
  let sy = top + rows * rowH + 30;
  if (sy + 30 > H - 20) { doc.addPage(); sy = M + 40; }
  const sw = (W - 2 * M) / sheet.signs.length;
  sheet.signs.forEach(([label, name, title], i) => {
    const x = M + i * sw + 10;
    doc.setFont("times", "normal"); doc.setFontSize(9.5); doc.text(`${label}:`, x, sy - 18);
    doc.setLineWidth(0.5); doc.line(x, sy, x + sw - 40, sy);
    if (name) { doc.setFont("times", "bold"); doc.text(name.toUpperCase(), x + (sw - 40) / 2, sy - 3, { align: "center" }); }
    doc.setFont("times", "italic"); doc.setFontSize(9); doc.text(title || "", x + (sw - 40) / 2, sy + 11, { align: "center" });
  });
}

async function makePdf() {
  const { ids, label } = readPrintForm();
  if (!window.jspdf?.jsPDF || !window.jspdf.jsPDF.API.autoTable) { renderPrintPanel("The PDF tools did not load. Check the connection and reopen the page.", true); return; }
  const doc = new window.jspdf.jsPDF({ orientation: "landscape", unit: "pt", format: "letter" });
  const build = { section: sectionSheet, teacher: teacherSheet, room: roomSheet }[printJob.kind];
  ids.forEach((id, i) => { if (i) doc.addPage(); drawSheet(doc, build(id)); });
  const pages = doc.getNumberOfPages(), W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const stamp = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i); doc.setFont("times", "italic"); doc.setFontSize(8); doc.setTextColor(0);
    doc.text(`Printed ${stamp}`, 40, H - 18); doc.text(`Page ${i} of ${pages}`, W - 40, H - 18, { align: "right" });
  }
  const name = label || (printJob.kind === "teacher" ? DATA.teachers[ids[0]].name : ids[0]);
  const filename = `${{ section: "Class schedule", teacher: "Teaching schedule", room: "Room schedule" }[printJob.kind]} - ${name}.pdf`.replace(/[\\/:*?"<>|]/g, "-");
  const result = await saveFile(filename, doc.output("blob"));
  renderPrintPanel(result, !/^(Saved|Created|Not saved)/.test(result));
}
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-pact]");
  if (!t) { if (ev.target.id === "printPanel") { printJob = null; renderPrintPanel(); } if (ev.target.id === "publishPanel") $("publishPanel").hidden = true; return; }
  if (t.dataset.pact === "cancel") { printJob = null; renderPrintPanel(); }
  if (t.dataset.pact === "make") { t.disabled = true; makePdf().finally(() => { const b = document.querySelector('[data-pact="make"]'); if (b) b.disabled = false; }); }
});

// ---------- start ----------
if (BACKEND) { $("app").hidden = true; startHosted().catch((e) => { loginMsg = "Could not reach the server: " + e.message; showLogin("signin"); }); }
else rebuild(), render();
if (!BACKEND) (async () => {
  let db = null;
  if (window.claude?.use) {
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { db = null; }
  }
  if (db) {
    store = db; shared = true;
    const can = user ? await user.can("data.write") : null;
    canWrite = can !== false;
  } else {
    store = memoryStore(); shared = false; canWrite = true;
  }
  listen();
})();
</script>
