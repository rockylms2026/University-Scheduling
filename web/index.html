<meta charset="utf-8">
<title>LAUCV Class Scheduling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout: registrar's scheduling office. Top bar, side menu, and one working area per menu item.
   The dashboard shows the whole term; the timetable desk is where classes are booked. */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #172030; --muted: #5a6575; --line: #dde1e7; --line2: #eceff3;
  --navy: #1b2f55; --navy-2: #24406f; --accent: #1f3f74; --accent-ink: #ffffff; --accent-soft: #e7ecf5; --lunch: #eceef2;
  --warn: #8a5a00; --warn-soft: #fff1cc; --bad: #b42318; --bad-soft: #fde4e1; --good: #1b6e40; --good-soft: #dcf2e4;
  --t-lec: #e2e9f6;  --t-lec-ink: #1d3a6b;
  --t-lab: #d9efe2;  --t-lab-ink: #155c35;
  --t-ge: #ebe6f7;   --t-ge-ink: #4a3787;
  --t-pe: #fce8cf;   --t-pe-ink: #7e4505;
  --t-cwts: #e6e8ec; --t-cwts-ink: #3a4352;
  --t-prac: #fae1ec; --t-prac-ink: #842050;
  --f-display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --row: 30px;            /* half an hour; one hour is 60px */
  color-scheme: light;   /* always light, whatever the device or claude.ai theme */
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.42; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h2 { font-weight: 700; font-size: 1.15rem; }
h3 { font-weight: 600; font-size: .95rem; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ----- app shell ----- */
.app { display: grid; grid-template-columns: 208px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; min-height: 100vh; }
.topbar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 20px; background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 15; }
.brand { display: grid; line-height: 1.2; margin-right: 6px; }
.brand b { font-family: var(--f-display); font-weight: 700; font-size: 1rem; letter-spacing: -.005em; }
.brand span { font-size: .74rem; opacity: .78; }
.tb-field { display: flex; gap: 6px; align-items: center; }
.topbar select, .topbar input { font: inherit; font-size: .86rem; color: #fff; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.28); border-radius: 6px; padding: 5px 8px; }
.topbar option, .topbar optgroup { color: var(--ink); background: #fff; }
.topbar input::placeholder { color: rgba(255,255,255,.7); }
.search { position: relative; flex: 1 1 180px; max-width: 440px; }
.search input { width: 100%; }
.results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(15,25,45,.18); max-height: 380px; overflow-y: auto; padding: 4px; z-index: 30; }
.results button { display: grid; grid-template-columns: 64px 1fr; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: .86rem; border: 0; background: transparent; color: var(--ink); padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.results button:hover, .results button.on { background: var(--accent-soft); }
.results small { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.results em { font-style: normal; color: var(--muted); font-size: .8rem; display: block; }
.publish { margin-left: auto; font: inherit; font-weight: 700; font-size: .88rem; background: #fff; color: var(--navy); border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
.publish:disabled { opacity: .55; cursor: not-allowed; }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 10px; position: sticky; top: 58px; align-self: start; max-height: calc(100vh - 58px); overflow-y: auto; display: grid; gap: 2px; }
.side button { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; font: inherit; font-size: .9rem; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.side button:hover { background: var(--bg); }
.side button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
.side .count { font-family: var(--f-mono); font-size: .7rem; font-weight: 600; padding: 1px 6px; border-radius: 999px; background: var(--lunch); color: var(--muted); }
.side .count.bad { background: var(--bad-soft); color: var(--bad); }
.side .sep { height: 1px; background: var(--line); margin: 8px 4px; }
.main { padding: 16px 20px 24px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.footer { grid-column: 2; position: sticky; bottom: 0; z-index: 12; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 20px; background: var(--panel); border-top: 1px solid var(--line); font-size: .84rem; color: var(--muted); }
.footer .grow { flex: 1; }
.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; }
.menu summary::-webkit-details-marker { display: none; }
.menu .pop { position: absolute; bottom: calc(100% + 6px); right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(15,25,45,.16); padding: 4px; display: grid; min-width: 220px; z-index: 30; }
.menu .pop button { font: inherit; font-size: .88rem; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.menu .pop button:hover { background: var(--accent-soft); }
.pagehead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 16px; }
.pagehead h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: .88rem; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: .88rem; }
.toast { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: .88rem; z-index: 50; box-shadow: 0 6px 18px rgba(0,0,0,.2); }

/* ----- common pieces ----- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.cardhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; }
.chip { font-size: .74rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip.none { background: var(--lunch); color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.navlabel { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; min-width: 70px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { font: inherit; font-size: .84rem; border: 0; background: transparent; color: var(--muted); padding: 5px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font: inherit; font-size: .83rem; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 3px 10px; border-radius: 999px; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.pill small { color: inherit; opacity: .75; font-family: var(--f-mono); font-size: .7rem; margin-left: 4px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .84rem; color: var(--muted); }
.facts b { color: var(--ink); font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .8rem; }
.btn { font: inherit; font-size: .85rem; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.link { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.msg { font-size: .84rem; }
.msg.bad { color: var(--bad); }
.msg.good { color: var(--good); }
.scroll { overflow-x: auto; }
select.inp, input.inp { font: inherit; font-size: .86rem; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line2); vertical-align: top; }
th { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; border-bottom-color: var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
td.num, th.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--bg); }
.bar { height: 5px; border-radius: 3px; background: var(--line2); overflow: hidden; min-width: 50px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.over i { background: var(--bad); }
.bar.near i { background: #c48a00; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .76rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid rgba(0,0,0,.08); }
.legend i.conf { background: #fff; border: 2px solid var(--bad); }
.legend i.offday { background: repeating-linear-gradient(135deg, var(--t-prac) 0 4px, #fff 4px 8px); }
.legend i.lunchk { background: var(--lunch); }
.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
.list { display: grid; gap: 1px; max-height: 70vh; overflow-y: auto; }
.listgrp { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 8px 8px 2px; }
.item { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: .88rem; border: 0; background: transparent; color: var(--ink); padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.item:hover { background: var(--bg); }
.item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.item small { color: var(--muted); font-family: var(--f-mono); font-size: .72rem; }
dl.about { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; font-size: .88rem; }
dl.about dt { color: var(--muted); }
dl.about dd { margin: 0; }
.headrow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: start; gap: 8px; }

/* ----- dashboard ----- */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; display: grid; gap: 3px; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.kpi:hover { border-color: var(--accent); }
.kpi .l { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.kpi .v { font-family: var(--f-display); font-weight: 700; font-size: 1.55rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: .85rem; color: var(--muted); font-weight: 500; margin-left: 4px; }
.kpi .s { font-size: .78rem; color: var(--muted); }
.kpi.alert .v { color: var(--bad); }
.dash { display: grid; grid-template-columns: minmax(0, 1fr) 316px; gap: 14px; align-items: start; }
.bottom { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.tablebox { max-height: 330px; overflow: auto; }
.queue { max-height: 720px; overflow-y: auto; display: grid; gap: 8px; align-content: start; }
.queue details > summary { cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: .86rem; padding: 4px 0; display: flex; justify-content: space-between; }
.qlist { display: grid; gap: 4px; margin-top: 4px; }
.qi { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; text-align: left; font: inherit; font-size: .8rem; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; cursor: grab; color: var(--ink); }
.qi:hover { border-color: var(--accent); }
.qi:active { cursor: grabbing; }
.qi .grip { width: 8px; height: 16px; background-image: radial-gradient(var(--muted) 1.2px, transparent 1.3px); background-size: 4px 4px; opacity: .6; }
.qi b { font-family: var(--f-mono); font-size: .76rem; }
.qi .m { display: block; color: var(--muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qi .h { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); text-align: right; }
.pat { font-size: .68rem; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--lunch); color: var(--ink); margin-left: 4px; }
.loads td { padding: 5px 6px; }
.loads td:first-child { min-width: 150px; }
.heat td, .heat th { padding: 3px 4px; text-align: center; }
.heat th:first-child, .heat td:first-child { text-align: left; white-space: nowrap; font-family: var(--f-mono); font-size: .74rem; }
.heat td.h { font-family: var(--f-mono); font-size: .7rem; min-width: 34px; border: 2px solid var(--panel); border-radius: 4px; }
.conf-list { display: grid; gap: 6px; }
.conf-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 7px 9px; border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: 6px; font-size: .82rem; }
.conf-item.warn { border-left-color: #c48a00; }
.conf-item .ty { font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--bad); }
.conf-item.warn .ty { color: var(--warn); }
.empty { color: var(--muted); font-size: .86rem; padding: 6px 0; }

/* ----- week grid ----- */
.week { display: grid; grid-template-columns: 46px repeat(var(--days), minmax(96px, 1fr)); min-width: 660px; padding-bottom: 8px; }
.dayhead { font-family: var(--f-display); font-weight: 600; font-size: .82rem; text-align: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.dayhead.off { color: var(--t-prac-ink); }
.times { position: relative; }
.times span { position: absolute; right: 6px; transform: translateY(-50%); font-family: var(--f-mono); font-size: .64rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.col { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px), linear-gradient(to bottom, var(--line2) 1px, transparent 1px); background-size: 100% calc(var(--row) * 2), 100% var(--row); }
.col.off { background-color: transparent; background-image: repeating-linear-gradient(135deg, var(--t-prac) 0 6px, transparent 6px 14px); }
.col.drop { background-color: var(--accent-soft); }
.lunch { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--lunch) 0 6px, #e4e7ec 6px 8px); display: flex; align-items: center; justify-content: center; gap: 4px; font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); z-index: 1; }
.away { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; font-size: .74rem; color: var(--t-prac-ink); font-weight: 600; }
.block { position: absolute; z-index: 2; border-radius: 5px; padding: 4px 6px; overflow: hidden; font-size: .72rem; line-height: 1.25; border: 1px solid rgba(0,0,0,.06); text-align: left; font-family: var(--f-body); cursor: pointer; }
.block strong { display: flex; gap: 3px; align-items: center; font-family: var(--f-mono); font-size: .7rem; font-weight: 600; }
.block span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.block .ttl { opacity: .85; }
.block strong { white-space: nowrap; }
.block strong .code { flex: none; }
.block strong .sec { font-family: var(--f-body); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.block.other { opacity: .5; }
.block.sel { box-shadow: 0 0 0 2px var(--accent); }
.block.clash { border: 2px solid var(--bad); }
.block .warnico { flex: none; width: 11px; height: 11px; color: var(--bad); }
.block.ghost { z-index: 3; background: var(--panel); color: var(--accent); border: 2px dashed var(--accent); pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.block.ghost.badghost { color: var(--bad); border-color: var(--bad); }
.ty-lec { background-color: var(--t-lec); color: var(--t-lec-ink); }
.ty-lab { background-color: var(--t-lab); color: var(--t-lab-ink); }
.ty-ge { background-color: var(--t-ge); color: var(--t-ge-ink); }
.ty-pe { background-color: var(--t-pe); color: var(--t-pe-ink); }
.ty-cwts { background-color: var(--t-cwts); color: var(--t-cwts-ink); }
.ty-prac { background-color: var(--t-prac); color: var(--t-prac-ink); }

/* ----- booking desk ----- */
.desk { display: grid; grid-template-columns: 370px minmax(0, 1fr); gap: 14px; align-items: start; }
.classes { display: grid; gap: 6px; }
.cls { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; }
.cls.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cls .t { display: flex; justify-content: space-between; gap: 8px; }
.cls .t b { font-family: var(--f-mono); font-size: .82rem; }
.cls .t span { color: var(--muted); font-size: .8rem; text-align: right; }
.cls .title { font-size: .85rem; }
.parts { display: flex; flex-wrap: wrap; gap: 6px; }
.part { font: inherit; font-size: .78rem; border: 1px dashed var(--muted); background: transparent; color: var(--ink); padding: 3px 8px; border-radius: 6px; cursor: pointer; text-align: left; }
.part.done { border-style: solid; border-color: var(--good); background: var(--good-soft); color: var(--good); }
.part.on { box-shadow: 0 0 0 2px var(--accent); }
.editor { border: 1px solid var(--accent); border-radius: 10px; padding: 12px; display: grid; gap: 12px; background: var(--panel); }
.editor label, .fieldlabel { display: grid; gap: 3px; font-size: .78rem; color: var(--muted); font-weight: 600; }
.editor select, .editor input[type=search] { font: inherit; font-size: .88rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
.opts { display: grid; gap: 4px; max-height: 250px; overflow-y: auto; padding-right: 2px; }
.optgrp { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-top: 4px; }
.opt { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; align-items: center; font: inherit; font-size: .82rem; text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 5px 8px; cursor: pointer; }
.opt b { font-family: var(--f-mono); font-size: .78rem; }
.opt > span { display: grid; min-width: 0; }
.opt.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-soft); }
.opt .why { font-size: .76rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.checks { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .84rem; }
.checks li { padding: 5px 8px; border-radius: 6px; }
.checks .bad { background: var(--bad-soft); color: var(--bad); }
.checks .warn { background: var(--warn-soft); color: var(--warn); }
.checks .good { background: var(--good-soft); color: var(--good); }
.checks .info { background: var(--lunch); color: var(--ink); }
.who-free { display: flex; flex-wrap: wrap; gap: 4px; }
.who-free span { font-size: .76rem; padding: 2px 8px; border-radius: 999px; background: var(--good-soft); color: var(--good); }
.who-free span.full { background: var(--warn-soft); color: var(--warn); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ----- sign-in, people, approvals ----- */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: linear-gradient(180deg, var(--navy) 0 38%, var(--bg) 38%); }
.login .box { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 14px; box-shadow: 0 10px 30px rgba(15,25,45,.12); }
.login h1 { font-size: 1.2rem; }
.login .uni { color: #fff; text-align: center; margin-bottom: 14px; font-family: var(--f-display); }
.login .uni b { display: block; font-size: 1.15rem; }
.login .uni span { font-size: .82rem; opacity: .8; }
.form label, label.form { min-width: 0; }
.form select, label.form select { width: 100%; min-width: 0; }
.form input, .form select { font: inherit; font-size: .92rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
.userchip { display: flex; align-items: center; gap: 8px; font-size: .78rem; line-height: 1.2; max-width: 240px; }
.userchip > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.userchip b { display: block; font-size: .84rem; }
.userchip span { opacity: .8; }
.userchip button { white-space: nowrap; font: inherit; font-size: .78rem; color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.35); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
.readonly { background: var(--lunch); color: var(--ink); border-radius: 6px; padding: 7px 10px; font-size: .84rem; }
.block.pending, .block.rejected { border: 1px dashed #b07800; }
.block.rejected { border-color: var(--bad); }
.block .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: #c48a00; }
.block.rejected .dot { background: var(--bad); }
.legend i.pend { background: #fff; border: 1px dashed #b07800; position: relative; }
.legend i.pend::after { content: ""; position: absolute; left: 2px; top: 2px; width: 6px; height: 6px; border-radius: 50%; background: #c48a00; }
.appr { display: inline-flex; gap: 4px; align-items: center; font-size: .78rem; white-space: nowrap; }
.appr.ok { color: var(--good); }
.appr.wait { color: var(--warn); }
.switch { display: flex; gap: 10px; align-items: center; font-size: .9rem; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }

/* ----- dialogs ----- */
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 28, .45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 40; }
.dialog { background: var(--panel); color: var(--ink); border-radius: 12px; border: 1px solid var(--line); padding: 18px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; display: grid; gap: 12px; }
.dialog label, .form label { display: grid; gap: 3px; font-size: .8rem; color: var(--muted); font-weight: 600; }
.dialog input, .form input { font: inherit; font-size: .9rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.dialog .choice { display: flex; gap: 8px; align-items: center; font-weight: 400; color: var(--ink); font-size: .9rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; align-items: start; }

/* ----- responsive: desktop first (1440), usable on tablets ----- */
@media (max-width: 1360px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .bottom { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .bottom > :first-child { grid-column: 1 / -1; } }
@media (max-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .topbar { position: static; }
  .side { position: static; max-height: none; display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px 10px; gap: 4px; }
  .side button { width: auto; white-space: nowrap; }
  .side button[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--accent); }
  .side .sep { display: none; }
  .footer { grid-column: 1; }
  .dash, .desk, .split { grid-template-columns: minmax(0, 1fr); }
  .queue { max-height: 420px; }
  .list { max-height: 260px; }
  .publish { margin-left: 0; }
}
@media (max-width: 760px) {
  .main { padding: 12px 16px 20px; }
  .topbar { padding: 10px 16px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bottom { grid-template-columns: minmax(0, 1fr); }
}

  }

// ---------- derived timetable ----------

// ---------- loads ----------

// ---------- the checks ----------

  const sec = DATA.sections[cls.section];

    if (sec.placement.includes(c.day) && meeting.kind !== "supervision") out.push(["bad", `Practicum: ${cls.section} is at practicum placement on ${c.day}`]);

      const shared = groups.filter((g) => s.groups.includes(g));

function findClashes() {

    const a = sessions[i], b = sessions[j];

    if (a.tkey && a.tkey === b.tkey && a.kind !== "nstp" && b.kind !== "nstp") out.push([a, b, "teacher"]);

const sLabel = (s) => `${s.cls.course}${s.part === "Lab" ? " Lab" : s.part === "Lec" ? "" : " " + PART[s.part]} · ${s.cls.section}`;
const dayList = (ss) => [...new Set(ss.map((s) => s.day))].sort((a, b) => DAYS.indexOf(a) - DAYS.indexOf(b)).join("/");

function computeConflicts() {
  const out = [];
  flagged = new Set();
  const byPair = new Map();
  clashes.forEach(([a, b, why]) => {
    const key = [why, a.cls.id, a.part, b.cls.id, b.part].join("|");
    if (!byPair.has(key)) byPair.set(key, { why, a, b, ss: [] });
    byPair.get(key).ss.push(a, b);
    flagged.add(a); flagged.add(b);
  });
  byPair.forEach(({ why, a, b, ss }) => out.push({
    sev: "bad", type: { students: "Student overlap", teacher: "Teacher double-booked", room: "Room double-booked" }[why],
    what: why === "students" ? `${a.cls.section} has two classes at once` : why === "teacher" ? `${DATA.teachers[a.tkey].name} teaches two classes at once` : `${a.room} holds two classes at once`,
    items: [sLabel(a), sLabel(b)], when: `${dayList(ss)} ${hm(Math.max(a.start, b.start))}–${hm(Math.min(a.end, b.end))}`,
    classes: [a.cls, b.cls], teacher: why === "teacher" ? a.tkey : null, go: { cls: a.cls.id, part: a.part } }));
  // Per booking: lunch, practicum days, double periods.
  const byBooking = new Map();
  sessions.forEach((s) => { const k = `${s.cls.id}|${s.part}`; if (!byBooking.has(k)) byBooking.set(k, []); byBooking.get(k).push(s); });
  byBooking.forEach((ss) => {
    const s = ss[0], sec = DATA.sections[s.cls.section];
    const lunch = ss.filter(hitsLunch);
    if (lunch.length) { lunch.forEach((x) => flagged.add(x)); out.push({ sev: "bad", type: "Lunch break", what: "Class runs into the lunch break", items: [sLabel(s)], when: `${dayList(lunch)} ${hm(s.start)}–${hm(s.end)}`, classes: [s.cls], go: { cls: s.cls.id, part: s.part } }); }
    const away = ss.filter((x) => x.kind !== "supervision" && sec.placement.includes(x.day));
    if (away.length) { away.forEach((x) => flagged.add(x)); out.push({ sev: "bad", type: "Practicum day", what: `${s.cls.section} is at practicum placement`, items: [sLabel(s)], when: dayList(away), classes: [s.cls], go: { cls: s.cls.id, part: s.part } }); }
  });
  const byClassDay = new Map();
  sessions.forEach((s) => { const k = `${s.cls.id}|${s.day}`; if (!byClassDay.has(k)) byClassDay.set(k, []); byClassDay.get(k).push(s); });
  byClassDay.forEach((ss) => {
    if (new Set(ss.map((s) => s.part)).size < 2) return;
    const a = ss[0], b = ss.find((s) => s.part !== a.part);
    out.push({ sev: "warn", type: "Double period", what: `${a.cls.course} meets twice in one day`, items: [sLabel(a), sLabel(b)], when: a.day, classes: [a.cls], go: { cls: a.cls.id, part: b.part } });
  });
  // Per teacher: hours in a day, load, preparations.
  const perDay = {};
  sessions.forEach((s) => { if (s.tkey && s.kind !== "nstp") { const k = `${s.tkey}|${s.day}`; (perDay[k] = perDay[k] || []).push(s); } });
  Object.entries(perDay).forEach(([k, ss]) => {
    const h = ss.reduce((a, s) => a + s.end - s.start, 0) / 60;
    if (h > DATA.facMax) { const [tk, day] = k.split("|"); out.push({ sev: "bad", type: "Teacher hours", what: `${DATA.teachers[tk].name}: ${h.toFixed(1)} teaching hours on ${day} (limit ${DATA.facMax})`, items: ss.map(sLabel), when: day, classes: ss.map((s) => s.cls), teacher: tk, go: { teacher: tk } }); }
  });
  Object.entries(loads).forEach(([k, L]) => {
    const t = DATA.teachers[k];
    if (L.lu > t.max) out.push({ sev: "bad", type: "Over load", what: `${t.name} carries ${L.lu} LU (limit ${t.max})`, items: [...L.courses], when: "", classes: [], teacher: k, go: { teacher: k } });
    if (L.cap != null && L.capped > L.cap) out.push({ sev: "bad", type: "Preparations", what: `${t.name} has ${L.capped} preparations (limit ${L.cap}, not counting intro and GE courses)`, items: [...L.courses], when: "", classes: [], teacher: k, go: { teacher: k } });
    else if (L.total > 5) out.push({ sev: "bad", type: "Preparations", what: `${t.name} has ${L.total} different courses (limit 5)`, items: [...L.courses], when: "", classes: [], teacher: k, go: { teacher: k } });
  });
  DATA.classes.forEach((c) => {
    const a = approvalOf(c);
    if (a?.state !== "rejected") return;
    out.push({ sev: "warn", type: "GE approval rejected", what: `${c.course} ${c.section} was not approved by ${a.approver}${a.row.note ? `: “${a.row.note}”` : ""}`,
      items: [`${c.course} · ${c.section}`], when: scheduleSig(c), classes: [c], go: { cls: c.id, part: c.meetings[0].part } });
  });

}

        if (L.cap != null && capped > L.cap) checks.push(["warn", `Teacher: this would be preparation ${capped} (limit ${L.cap})`]);
        else if (L.total + 1 > 5) checks.push(["warn", `Teacher: this would be ${L.total + 1} different courses (limit 5)`]);
      }
    } else if (m.kind !== "nstp" && !tRight) checks.push(["warn", "No teacher assigned yet"]);
    const ok = !checks.some(([l]) => l === "bad") && !right;
    if (canHand(cls)) checks.push(["info", holderOf(cls).handed
      ? `Handed over: ${cls.holder} gave this class to ${cls.house}, its house department. Use “Take back” on the Approvals page to return it.`
      : `Hand-over: if ${cls.holder} has no instructor for this class, hand it to ${cls.house}, the house department, which will pick a teacher.`]);
    if (BACKEND && borrowed) {
      const cur = approvalOf(cls);
      checks.push(["info", `Approval: ${cls.course} is held by the ${holderOf(cls).dept} department${holderOf(cls).college !== progCollege(cls.section) ? ` (${holderOf(cls).college})` : ""}, so this booking waits for ${cur.approver}, who also picks the teacher.`
        + (cur.state === "approved" ? " Now: approved." : cur.state === "rejected" ? ` Now: not approved${cur.row.note ? ` (“${cur.row.note}”)` : ""}.` : cur.state === "pending" ? " Now: waiting." : " Booking it sends the request.")]);
    }
    detail = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">${roomSel}${teacherSel}</div>
      <div><span class="fieldlabel">Teachers free at ${esc(opt.label)}${near.length ? " from the same department" : ""}</span>
        <div class="who-free" style="margin-top:4px">${(near.length ? near : ft).slice(0, 14).map((x) => `<span class="${x.full ? "full" : ""}">${esc(DATA.teachers[x.key].name)} · ${luFor(x.key)}/${DATA.teachers[x.key].max}</span>`).join("") || `<span class="full">Nobody in this department is free</span>`}
        ${(near.length ? near : ft).length > 14 ? `<span>+${(near.length ? near : ft).length - 14} more in the list</span>` : ""}</div></div>
      <ul class="checks">${checks.length ? checks.map(([l, txt]) => `<li class="${l}">${esc(txt)}</li>`).join("") : `<li class="good">No conflicts. Students, teacher, and room are all free.</li>`}</ul>
      <div class="actions"><button type="button" class="btn primary" data-act="save"${ok && canWrite ? "" : " disabled"}>${b ? "Save changes" : "Book this time"}</button>
        ${b ? `<button type="button" class="btn danger" data-act="remove"${canWrite && !right ? "" : " disabled"}>Remove booking</button>` : ""}
        ${canHand(cls) ? `<button type="button" class="btn" data-hand="${holderOf(cls).handed ? "back" : "house"}" data-cid="${cls.id}">${holderOf(cls).handed ? `Take back for ${esc(cls.holder)}` : `Hand to ${esc(cls.house)}`}</button>` : ""}
        <button type="button" class="btn" data-act="close">Close</button><span class="msg" id="msg"></span></div>`;
  }
  return `<div class="editor"><div><h3>${esc(cls.course)} ${esc(PART[part])} · ${esc(cls.section)}</h3>
    <div class="facts"><span>${esc(course.title)}</span><span><b>${cls.lu}</b> LU</span>${b ? `<span>Booked: <b>${esc(b.pattern)}</b>${b.room ? ` in <b>${esc(b.room)}</b>` : ""}</span>` : ""}</div></div>
    <div><span class="fieldlabel">Choose a time (allowed by the University Class Time Frame)</span><div class="opts" style="margin-top:4px">${optHtml}</div></div>
    ${right ? `<div class="readonly">${esc(right)}</div>` : ""}
    ${detail}</div>`;
}

let teacherChoices = { free: [], busy: null, selected: "" };
let teacherQuery = "";
function teacherOptions() {
  const q = teacherQuery.trim().toLowerCase();
  const match = (txt) => !q || txt.toLowerCase().includes(q);
  const sel = teacherChoices.selected;
  const free = teacherChoices.free.filter((x) => match(x.text) || x.key === sel);
  let html = `<option value="">No teacher yet</option>`;
  html += `<optgroup label="Free at this time${q ? ` · matching “${esc(teacherQuery.trim())}”` : ""}">${free.map((x) =>
    `<option value="${x.key}"${x.key === sel ? " selected" : ""}>${esc(x.text)}</option>`).join("")}</optgroup>`;
  if (teacherChoices.busy) html += `<optgroup label="Busy at this time"><option value="${teacherChoices.busy}" selected>${esc(DATA.teachers[teacherChoices.busy].name)}</option></optgroup>`;
  const count = teacherChoices.free.filter((x) => match(x.text)).length;
  setTimeout(() => { const c = $("teacherCount"); if (c) c.textContent = q ? `${count} of ${teacherChoices.free.length} free teachers match` : `${teacherChoices.free.length} teachers free at this time`; });
  return html;
}

// ===== Approvals (hosted version) =====
function approvalList() {
  return DATA.classes.map((c) => ({ c, a: approvalOf(c) })).filter(({ c, a }) => {
    if (!a || a.state === "unscheduled") return false;
    if (isAdmin() || me.role === "ge_coordinator") return true;
    if (me.role === "chair") return progDept(c.section) === me.department || holderOf(c).dept === me.department || c.holder === me.department;
    return progCollege(c.section) === me.college || holderOf(c).college === me.college || c.holderCollege === me.college;
  });
}

      }).join("")}</tbody></table></div>` : `<p class="empty">Nothing here.</p>`}</div>`;
}
async function decide(cid, decision) {
  let note = null, teacher = null;
  if (decision === "reject") { note = window.prompt("Reason (shown to the department that booked it):", ""); if (note === null) return false; }
  if (decision === "approve") {
    const sel = $(`apT-${cid}`);

    if (sel && !teacher) { toast(`Choose a teacher for ${CLASS[cid].course} ${CLASS[cid].section} first.`); return false; }
  }
  const { error } = await sb.rpc("decide_ge", { cid, decision, note, teacher });
  if (error) { toast(sbMessage(error)); return false; }
  return true;
}

// A class dropped on the dashboard timetable: open it at the allowed time that starts nearest the drop point.
function dropAt(clsId, part, day, minute) {
  const cls = CLASS[clsId]; const m = cls?.meetings.find((x) => x.part === part);
  if (!m) return;
  const fits = optionsFor(m.kind).filter((o) => o.iv.some(([d, s, e]) => d === day && s <= minute && minute < e))
    .sort((a, b) => (a.ex ? 1 : 0) - (b.ex ? 1 : 0) || Math.abs(a.iv.find((i) => i[0] === day)[1] - minute) - Math.abs(b.iv.find((i) => i[0] === day)[1] - minute));
  openPick(clsId, part);
  if (fits.length) choosePattern(fits[0].label);
  else toast(`No allowed time for ${cls.course} ${PART[part].toLowerCase()} on ${day} at ${hm(minute)}. Choose one from the list.`);
}

function runSearch(q) {

    : `<p class="empty" style="padding:8px">No matches.</p>`;

function goHit(i) { const h = searchHits[i]; if (!h) return; h.go(); if (!allowedScopes().includes(state.scope)) state.scope = allowedScopes()[0]; state.pick = null; $("results").hidden = true; $("search").value = ""; render(); window.scrollTo(0, 0); }

// ---------- events ----------
document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button, tr[data-goteacher], tr[data-goroom]");
  if (!ev.target.closest(".search")) $("results").hidden = true;
  if (!ev.target.closest("#exportMenu")) $("exportMenu")?.removeAttribute("open");
  if (!t) return;
  const ds = t.dataset;
  if (ds.hit) { goHit(+ds.hit); return; }
  if (ds.auth) { if (ds.auth === "signout") { await sb.auth.signOut(); return; } showLogin(ds.auth); return; }
  if (ds.decide) {
    t.disabled = true;

    return;
  }
  if (ds.hand) {
    const c = CLASS[ds.cid];
    const q = ds.hand === "back" ? `Take ${c.course} ${c.section} back for ${c.holder}? Its teacher returns to the loading plan.`
      : `Hand ${c.course} ${c.section} to ${c.house}? ${c.house} will hold it and pick the teacher.`;
    if (!window.confirm(q)) return;
    const { error } = await sb.rpc("hand_to_house", { cid: ds.cid, undo: ds.hand === "back" });
    if (error) { toast(sbMessage(error)); return; }
    await Promise.all([sbLoad.ge_holders(), sbLoad.ge_decisions(), sbLoad.teacher_changes()]);
    if (state.draft && state.pick?.cls === ds.cid) state.draft.teacher = teacherOf(c)?.key || "";

  }
  if (ds.decideall) {
    const list = approvalList().filter((x) => needsMe(x.c, x.a));

    for (const [i, x] of list.entries()) { t.textContent = `Approving ${i + 1} of ${list.length}…`; if (!(await decide(x.c.id, "approve"))) break; }
    await Promise.all([sbLoad.ge_decisions(), sbLoad.teacher_changes()]); rebuild(); render(); return;
  }
  if (ds.apprfilter) { state.apprFilter = ds.apprfilter; render(); return; }

function loadScript(src) {

}
async function saveFile(filename, data) {
  const dl = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename, data }); return "Saved " + filename; }
    catch (err) { return err?.code === "declined" ? "Not saved." : "The file could not be saved here."; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); a.download = filename; a.click();
  return "Created " + filename;
}
async function exportExcel() {

      hmap(o.iv[0][1]), hmap(o.iv[0][2]), b.room || (m.kind === "nstp" ? "Grounds" : ""), teacherName(teacherOf(c)).replace("No teacher yet", "TBA")]);

function roomSheet(room) {

function drawSheet(doc, sheet) {

  if (printCfg.university) { center(printCfg.university.toUpperCase(), 14, "bold"); y += 16; }
  if (printCfg.office) { center(printCfg.office, 11); y += 15; }
  y += 4;
  center(sheet.title, 13, "bold"); y += 14;
  center(`First Semester, Academic Year ${printCfg.ay}`, 10.5, "italic"); y += 9;
  doc.setLineWidth(0.8); doc.line(M, y, W - M, y); doc.setLineWidth(0.3); doc.line(M, y + 2.5, W - M, y + 2.5);
  y += 16;
  // Information block, two columns.
  doc.setFontSize(10);
  const colW = (W - 2 * M) / 2;
  for (let i = 0; i < sheet.info.length; i += 2) {      // label/value pairs, two per line, values wrap
    let lines = 1;
    [sheet.info[i], sheet.info[i + 1]].forEach((pair, j) => {
      if (!pair) return;
      const x = M + j * colW, wrapped = doc.splitTextToSize(String(pair[1]), colW - 118);
      doc.setFont("times", "bold"); doc.text(`${pair[0]}:`, x, y);
      doc.setFont("times", "normal"); doc.text(wrapped, x + 112, y);
      lines = Math.max(lines, wrapped.length);
    });
    y += lines * 12 + 2;
  }
  y += 2;
  // Class list.
  doc.autoTable({
    startY: y, head: [sheet.head], body: sheet.rows.length ? sheet.rows : [[{ content: "No classes scheduled.", colSpan: sheet.head.length }]],
    theme: "grid", margin: { left: M, right: M },
    styles: { font: "times", fontSize: 8.5, textColor: 0, lineColor: 0, lineWidth: 0.4, cellPadding: 3, valign: "top" },
    headStyles: { fillColor: [255, 255, 255], textColor: 0, fontStyle: "bold", halign: "center", lineWidth: 0.6 },
    columnStyles: Object.fromEntries(sheet.widths.map((w, i) => [i, w ? { cellWidth: w } : {}])),
  });
  y = doc.lastAutoTable.finalY + 14;
  // Weekly timetable grid.
  const rows = (DATA.end - DATA.start) / DATA.slot;
  const signH = 52;
  let rowH = Math.min(15, (H - M - signH - y - 22) / rows);
  if (rowH < 10) { doc.addPage(); y = M; center(`${sheet.title} (continued): ${sheet.name}`, 10.5, "bold"); y += 16; rowH = Math.min(20, (H - M - signH - y - 22) / rows); }
  doc.setFont("times", "bold"); doc.setFontSize(10); doc.text("Weekly timetable", M, y); y += 6;
  const timeW = 62, dayW = (W - 2 * M - timeW) / DAYS.length, top = y + 14;
  doc.setLineWidth(0.6); doc.rect(M, y, W - 2 * M, 14 + rows * rowH);
  doc.setFontSize(9);
  doc.text("Time", M + timeW / 2, y + 10, { align: "center" });
  DAYS.forEach((d, i) => doc.text({ Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday" }[d], M + timeW + dayW * (i + 0.5), y + 10, { align: "center" }));
  doc.line(M, top, W - M, top);
  doc.setLineWidth(0.2); doc.setDrawColor(150);
  for (let r = 1; r < rows; r++) doc.line(M + timeW, top + r * rowH, W - M, top + r * rowH);
  doc.setDrawColor(0); doc.setLineWidth(0.4);
  for (let i = 0; i <= DAYS.length; i++) doc.line(M + timeW + dayW * i, y, M + timeW + dayW * i, top + rows * rowH);
  doc.setFont("times", "normal"); doc.setFontSize(7.5);
  for (let r = 0; r < rows; r++) {
    const m = DATA.start + r * DATA.slot;
    if (r % 2 === 0) { doc.text(`${hm(m)}–${hm(m + 60)}`, M + timeW / 2, top + r * rowH + rowH * 0.75, { align: "center" }); doc.setDrawColor(0); doc.setLineWidth(0.3); if (r) doc.line(M, top + r * rowH, M + timeW, top + r * rowH); }
  }
  const yOf = (m) => top + ((m - DATA.start) / DATA.slot) * rowH;
  doc.setFont("times", "italic"); doc.setFontSize(7.5);
  DAYS.forEach((d, i) => {
    const x = M + timeW + dayW * i;
    if (sheet.off.includes(d)) {
      doc.setFillColor(255, 255, 255); doc.rect(x + 0.4, top + 0.4, dayW - 0.8, rows * rowH - 0.8, "F");
      doc.text("Practicum placement", x + dayW / 2, top + rows * rowH / 2, { align: "center" }); return;
    }
    if (LUNCH[d]) {          // a clear band, no grid lines, labelled
      const y1 = yOf(LUNCH[d][0]), y2 = yOf(LUNCH[d][1]);
      doc.setFillColor(255, 255, 255); doc.rect(x + 0.4, y1 + 0.3, dayW - 0.8, y2 - y1 - 0.6, "F");
      doc.setDrawColor(0); doc.setLineWidth(0.2); doc.setLineDashPattern([1.5, 1.5], 0);
      doc.line(x, y1, x + dayW, y1); doc.line(x, y2, x + dayW, y2); doc.setLineDashPattern([], 0);
      doc.text("LUNCH BREAK", x + dayW / 2, (y1 + y2) / 2 + 2.5, { align: "center" });
    }
  });
  DAYS.forEach((d, i) => {
    const day = sheet.sessions.filter((s) => s.day === d).sort((a, b) => a.start - b.start);
    const lanes = [];
    day.forEach((s) => { let k = lanes.findIndex((e) => e <= s.start); if (k < 0) { k = lanes.length; lanes.push(0); } lanes[k] = s.end; s._pl = k; });
    day.forEach((s) => {
      const n = Math.max(1, day.filter((o) => o.start < s.end && s.start < o.end).reduce((a, o) => Math.max(a, o._pl + 1), 0));
      const w = dayW / n, x = M + timeW + dayW * i + s._pl * w, y1 = yOf(s.start), h = yOf(s.end) - y1;
      doc.setFillColor(255, 255, 255); doc.setDrawColor(0); doc.setLineWidth(0.7);
      doc.rect(x + 1.2, y1 + 1, w - 2.4, h - 2, "FD");
      const lines = sheet.cell(s).filter(Boolean);
      const maxLines = Math.max(1, Math.floor((h - 3) / 8));
      lines.slice(0, maxLines).forEach((ln, j) => {
        doc.setFont("times", j === 0 ? "bold" : "normal"); doc.setFontSize(j === 0 ? 7.5 : 7);
        doc.text(doc.splitTextToSize(ln, w - 5)[0], x + w / 2, y1 + 8.5 + j * 8, { align: "center" });
      });
    });
  });
  // Signatures.
  let sy = top + rows * rowH + 30;
  if (sy + 30 > H - 20) { doc.addPage(); sy = M + 40; }
  const sw = (W - 2 * M) / sheet.signs.length;
  sheet.signs.forEach(([label, name, title], i) => {
    const x = M + i * sw + 10;
    doc.setFont("times", "normal"); doc.setFontSize(9.5); doc.text(`${label}:`, x, sy - 18);
    doc.setLineWidth(0.5); doc.line(x, sy, x + sw - 40, sy);
    if (name) { doc.setFont("times", "bold"); doc.text(name.toUpperCase(), x + (sw - 40) / 2, sy - 3, { align: "center" }); }
    doc.setFont("times", "italic"); doc.setFontSize(9); doc.text(title || "", x + (sw - 40) / 2, sy + 11, { align: "center" });
  });
}

async function makePdf() {
  const { ids, label } = readPrintForm();
  if (!window.jspdf?.jsPDF || !window.jspdf.jsPDF.API.autoTable) { renderPrintPanel("The PDF tools did not load. Check the connection and reopen the page.", true); return; }
  const doc = new window.jspdf.jsPDF({ orientation: "landscape", unit: "pt", format: "letter" });
  const build = { section: sectionSheet, teacher: teacherSheet, room: roomSheet }[printJob.kind];
  ids.forEach((id, i) => { if (i) doc.addPage(); drawSheet(doc, build(id)); });
  const pages = doc.getNumberOfPages(), W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const stamp = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i); doc.setFont("times", "italic"); doc.setFontSize(8); doc.setTextColor(0);
    doc.text(`Printed ${stamp}`, 40, H - 18); doc.text(`Page ${i} of ${pages}`, W - 40, H - 18, { align: "right" });
  }
  const name = label || (printJob.kind === "teacher" ? DATA.teachers[ids[0]].name : ids[0]);
  const filename = `${{ section: "Class schedule", teacher: "Teaching schedule", room: "Room schedule" }[printJob.kind]} - ${name}.pdf`.replace(/[\\/:*?"<>|]/g, "-");
  const result = await saveFile(filename, doc.output("blob"));
  renderPrintPanel(result, !/^(Saved|Created|Not saved)/.test(result));
}
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-pact]");
  if (!t) { if (ev.target.id === "printPanel") { printJob = null; renderPrintPanel(); } if (ev.target.id === "publishPanel") $("publishPanel").hidden = true; return; }
  if (t.dataset.pact === "cancel") { printJob = null; renderPrintPanel(); }
  if (t.dataset.pact === "make") { t.disabled = true; makePdf().finally(() => { const b = document.querySelector('[data-pact="make"]'); if (b) b.disabled = false; }); }
});

// ---------- start ----------
if (BACKEND) { $("app").hidden = true; startHosted().catch((e) => { loginMsg = "Could not reach the server: " + e.message; showLogin("signin"); }); }
else rebuild(), render();
if (!BACKEND) (async () => {
  let db = null;
  if (window.claude?.use) {
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { db = null; }
  }
  if (db) {
    store = db; shared = true;
    const can = user ? await user.can("data.write") : null;
    canWrite = can !== false;
  } else {
    store = memoryStore(); shared = false; canWrite = true;
  }
  listen();
})();
</script>
