<meta charset="utf-8">
<title>LAUCV Class Scheduling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<!--__SUPABASE_JS__-->
<style>
/* Layout: white top bar with a centred search, a narrow icon menu whose groups open a small panel,
   and one working area per page. Home greets the person and lists what waits for them. */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #172030; --muted: #5a6575; --line: #dde1e7; --line2: #eceff3;
  --navy: #1b2f55; --navy-2: #24406f; --accent: #1f3f74; --accent-ink: #ffffff; --accent-soft: #e7ecf5; --lunch: #eceef2; --hover: #e3e5e9; --ease: cubic-bezier(.2, .8, .2, 1);
  --warn: #8a5a00; --warn-soft: #fff1cc; --bad: #b42318; --bad-soft: #fde4e1; --good: #1b6e40; --good-soft: #dcf2e4;
  --t-lec: #e2e9f6;  --t-lec-ink: #1d3a6b;
  --t-lab: #d9efe2;  --t-lab-ink: #155c35;
  --t-ge: #ebe6f7;   --t-ge-ink: #4a3787;
  --t-pe: #fce8cf;   --t-pe-ink: #7e4505;
  --t-cwts: #e6e8ec; --t-cwts-ink: #3a4352;
  --t-prac: #fae1ec; --t-prac-ink: #842050;
  --f-display: "Roboto", "Segoe UI", system-ui, sans-serif;
  --f-body: "Roboto", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Roboto Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --top: 64px;            /* height of the top bar */
  --rail: 92px;           /* width of the icon menu */
  --row: 30px;            /* half an hour; one hour is 60px */
  color-scheme: light;   /* always light, whatever the device or claude.ai theme */
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; letter-spacing: .005em; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h2 { font-weight: 500; font-size: 1.15rem; }
h3 { font-weight: 500; font-size: .95rem; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ----- app shell ----- */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; min-height: 100vh; }
.topbar { grid-column: 1 / -1; display: grid; grid-template-columns: auto minmax(220px, 560px) auto; justify-content: space-between; align-items: center; gap: 10px 20px; min-height: var(--top); padding: 8px 20px; background: var(--panel); color: var(--ink); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 15; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .seal { flex: none; width: 42px; height: 42px; border-radius: 50%; }
.brand div { display: grid; line-height: 1.15; min-width: 0; }
.brand b { font-weight: 700; font-size: 1.05rem; color: var(--navy); letter-spacing: .02em; }
.brand span { font-size: .74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; }
.tb-field { display: flex; gap: 6px; align-items: center; }
.topbar select { font: inherit; font-size: .84rem; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px; max-width: 160px; }
.search { position: relative; width: 100%; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; font: inherit; font-size: .95rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px 10px 42px; }
.search input::placeholder { color: var(--muted); }
.search input:focus { background: var(--panel); border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(15,25,45,.16); max-height: 380px; overflow-y: auto; padding: 6px; z-index: 30; }
.results button { display: grid; grid-template-columns: 64px 1fr; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: .88rem; border: 0; background: transparent; color: var(--ink); padding: 7px 9px; border-radius: 8px; cursor: pointer; }
.results button:hover, .results button.on { background: var(--accent-soft); }
.results small { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.results em { font-style: normal; color: var(--muted); font-size: .8rem; display: block; }
.iconbtn { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; font: inherit; }
.iconbtn:hover { background: var(--bg); }
.iconbtn .sr, .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.iconbtn b { position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #d92d20; color: #fff; font-size: .68rem; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--panel); }
.avatar { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--navy); color: #fff; font: inherit; font-weight: 500; font-size: .86rem; letter-spacing: .03em; cursor: pointer; }
.avatar:hover { box-shadow: 0 0 0 3px var(--accent-soft); }
.usermenu { position: relative; }
.usermenu .pop { position: absolute; top: calc(100% + 8px); right: 0; width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(15,25,45,.16); padding: 8px; display: grid; gap: 2px; z-index: 30; }
.usermenu .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--line2); margin-bottom: 4px; display: grid; gap: 2px; }
.usermenu .who b { font-weight: 500; font-size: .95rem; }
.usermenu .who span { font-size: .8rem; color: var(--muted); }
.usermenu .pop button { font: inherit; font-size: .9rem; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.usermenu .pop button:hover { background: var(--bg); }
/* icon menu: one column of icons with their names; groups open a small panel beside it */
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 12px 6px 56px; position: sticky; top: var(--top); align-self: start; height: calc(100vh - var(--top)); overflow-y: auto; display: flex; flex-direction: column; gap: 4px; z-index: 14; }
.side .spacer { flex: 1; }
.rail { position: relative; display: grid; justify-items: center; gap: 5px; width: 100%; font: inherit; font-size: .72rem; font-weight: 500; line-height: 1.2; text-align: center; border: 0; background: transparent; color: var(--ink); padding: 6px 2px; cursor: pointer; }
.rail .ic { position: relative; width: 46px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--ink); }
.rail:hover .ic, .rail[aria-current="page"] .ic, .rail[aria-expanded="true"] .ic { background: var(--hover); }
.rail[aria-current="page"] { font-weight: 700; }
.rail .ic b { position: absolute; top: -3px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #d92d20; color: #fff; font-size: .66rem; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--panel); }
.flyout { position: fixed; z-index: 35; width: 270px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 34px rgba(15,25,45,.18); padding: 14px 8px 8px; display: grid; gap: 2px; }
.flyout h2 { font-size: 1rem; font-weight: 700; padding: 0 10px 8px; }
.flyout button { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: inherit; font-size: .92rem; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 10px 10px; border-radius: 8px; cursor: pointer; }
.flyout button:hover { background: var(--bg); }
.flyout button[aria-current="page"] { background: var(--hover); font-weight: 500; }
.flyout button small { color: var(--muted); font-size: .76rem; display: block; margin-top: 1px; }
.count { font-family: var(--f-mono); font-size: .7rem; font-weight: 500; padding: 1px 7px; border-radius: 999px; background: var(--lunch); color: var(--muted); }
.count.bad { background: var(--bad-soft); color: var(--bad); }
.publish { font: inherit; font-weight: 500; font-size: .86rem; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.publish:disabled { opacity: .55; cursor: not-allowed; }
.main { --px: 24px; --pt: 18px; padding: var(--pt) var(--px) 28px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.footer { grid-column: 2; position: sticky; bottom: 0; z-index: 12; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 20px; background: var(--panel); border-top: 1px solid var(--line); font-size: .84rem; color: var(--muted); }
.footer .grow { flex: 1; }
.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; }
.menu summary::-webkit-details-marker { display: none; }
.menu .pop { position: absolute; bottom: calc(100% + 6px); right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(15,25,45,.16); padding: 4px; display: grid; min-width: 220px; z-index: 30; }
.menu .pop button { font: inherit; font-size: .88rem; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.menu .pop button:hover { background: var(--accent-soft); }
.pagehead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 16px; }
.pagehead h1 { font-size: 1.5rem; font-weight: 500; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: .88rem; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: .88rem; }
.toast { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: .88rem; z-index: 50; box-shadow: 0 6px 18px rgba(0,0,0,.2); }

/* ----- common pieces ----- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.cardhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; }
.chip { font-size: .74rem; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip.none { background: var(--lunch); color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.navlabel { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; min-width: 70px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { font: inherit; font-size: .84rem; border: 0; background: transparent; color: var(--muted); padding: 5px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 500; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font: inherit; font-size: .83rem; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 3px 10px; border-radius: 999px; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.pill small { color: inherit; opacity: .75; font-family: var(--f-mono); font-size: .7rem; margin-left: 4px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .84rem; color: var(--muted); }
.facts b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .8rem; }
.btn { font: inherit; font-size: .85rem; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.danger { color: var(--bad); }
.btn.link { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 500; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.msg { font-size: .84rem; }
.msg.bad { color: var(--bad); }
.msg.good { color: var(--good); }
.scroll { overflow-x: auto; }
select.inp, input.inp { font: inherit; font-size: .86rem; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line2); vertical-align: top; }
th { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; border-bottom-color: var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
td.num, th.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--bg); }
.bar { height: 5px; border-radius: 3px; background: var(--line2); overflow: hidden; min-width: 50px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.over i { background: var(--bad); }
.bar.near i { background: #c48a00; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .76rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid rgba(0,0,0,.08); }
.legend i.conf { background: #fff; border: 2px solid var(--bad); }
.legend i.offday { background: repeating-linear-gradient(135deg, var(--t-prac) 0 4px, #fff 4px 8px); }
.legend i.lunchk { background: var(--lunch); }
.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
.list { display: grid; gap: 1px; max-height: 70vh; overflow-y: auto; }
.listgrp { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; padding: 8px 8px 2px; }
.item { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: .88rem; border: 0; background: transparent; color: var(--ink); padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.item:hover { background: var(--bg); }
.item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.item small { color: var(--muted); font-family: var(--f-mono); font-size: .72rem; }
dl.about { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; font-size: .88rem; }
dl.about dt { color: var(--muted); }
dl.about dd { margin: 0; }
.headrow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: start; gap: 8px; }

/* ----- dashboard ----- */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; display: grid; gap: 3px; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.kpi:hover { border-color: var(--accent); }
.kpi .l { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; }
.kpi .v { font-family: var(--f-display); font-weight: 700; font-size: 1.55rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: .85rem; color: var(--muted); font-weight: 500; margin-left: 4px; }
.kpi .s { font-size: .78rem; color: var(--muted); }
.kpi.alert .v { color: var(--bad); }
.dash { display: grid; grid-template-columns: minmax(0, 1fr) 316px; gap: 14px; align-items: start; }
.bottom { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.tablebox { max-height: 330px; overflow: auto; }
.queue { max-height: 720px; overflow-y: auto; display: grid; gap: 8px; align-content: start; }
.queue details > summary { cursor: pointer; font-family: var(--f-display); font-weight: 500; font-size: .86rem; padding: 4px 0; display: flex; justify-content: space-between; }
.qlist { display: grid; gap: 4px; margin-top: 4px; }
.qi { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; text-align: left; font: inherit; font-size: .8rem; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; cursor: grab; color: var(--ink); }
.qi:hover { border-color: var(--accent); }
.qi:active { cursor: grabbing; }
.qi .grip { width: 8px; height: 16px; background-image: radial-gradient(var(--muted) 1.2px, transparent 1.3px); background-size: 4px 4px; opacity: .6; }
.qi b { font-family: var(--f-mono); font-size: .76rem; }
.qi .m { display: block; color: var(--muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qi .h { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); text-align: right; }
.pat { font-size: .68rem; font-weight: 500; padding: 1px 6px; border-radius: 4px; background: var(--lunch); color: var(--ink); margin-left: 4px; }
.loads td { padding: 5px 6px; }
.loads td:first-child { min-width: 150px; }
.heat td, .heat th { padding: 3px 4px; text-align: center; }
.heat th:first-child, .heat td:first-child { text-align: left; white-space: nowrap; font-family: var(--f-mono); font-size: .74rem; }
.heat td.h { font-family: var(--f-mono); font-size: .7rem; min-width: 34px; border: 2px solid var(--panel); border-radius: 4px; }
.conf-list { display: grid; gap: 6px; }
.conf-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 7px 9px; border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: 6px; font-size: .82rem; }
.conf-item.warn { border-left-color: #c48a00; }
.conf-item .ty { font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--bad); }
.conf-item.warn .ty { color: var(--warn); }
.empty { color: var(--muted); font-size: .86rem; padding: 6px 0; }

/* ----- week grid ----- */
.week { display: grid; grid-template-columns: 46px repeat(var(--days), minmax(96px, 1fr)); min-width: 660px; padding-bottom: 8px; }
.dayhead { font-family: var(--f-display); font-weight: 500; font-size: .82rem; text-align: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.dayhead.off { color: var(--t-prac-ink); }
.times { position: relative; }
.times span { position: absolute; right: 6px; transform: translateY(-50%); font-family: var(--f-mono); font-size: .64rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.col { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px), linear-gradient(to bottom, var(--line2) 1px, transparent 1px); background-size: 100% calc(var(--row) * 2), 100% var(--row); }
.col.off { background-color: transparent; background-image: repeating-linear-gradient(135deg, var(--t-prac) 0 6px, transparent 6px 14px); }
.col.drop { background-color: var(--accent-soft); }
.lunch { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--lunch) 0 6px, #e4e7ec 6px 8px); display: flex; align-items: center; justify-content: center; gap: 4px; font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); z-index: 1; }
.away { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; font-size: .74rem; color: var(--t-prac-ink); font-weight: 500; }
.block { position: absolute; z-index: 2; border-radius: 5px; padding: 4px 6px; overflow: hidden; font-size: .72rem; line-height: 1.25; border: 1px solid rgba(0,0,0,.06); text-align: left; font-family: var(--f-body); cursor: pointer; }
.block strong { display: flex; gap: 3px; align-items: center; font-family: var(--f-mono); font-size: .7rem; font-weight: 500; }
.block span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.block .ttl { opacity: .85; }
.block strong { white-space: nowrap; }
.block strong .code { flex: none; }
.block strong .sec { font-family: var(--f-body); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.block.other { opacity: .5; }
.block.sel { box-shadow: 0 0 0 2px var(--accent); }
.block.clash { border: 2px solid var(--bad); }
.block .warnico { flex: none; width: 11px; height: 11px; color: var(--bad); }
.block.ghost { z-index: 3; background: var(--panel); color: var(--accent); border: 2px dashed var(--accent); pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.block.ghost.badghost { color: var(--bad); border-color: var(--bad); }
.ty-lec { background-color: var(--t-lec); color: var(--t-lec-ink); }
.ty-lab { background-color: var(--t-lab); color: var(--t-lab-ink); }
.ty-ge { background-color: var(--t-ge); color: var(--t-ge-ink); }
.ty-pe { background-color: var(--t-pe); color: var(--t-pe-ink); }
.ty-cwts { background-color: var(--t-cwts); color: var(--t-cwts-ink); }
.ty-prac { background-color: var(--t-prac); color: var(--t-prac-ink); }

/* ----- booking desk ----- */
.desk { display: grid; grid-template-columns: 370px minmax(0, 1fr); gap: 14px; align-items: start; }
.classes { display: grid; gap: 6px; }
.cls { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; }
.cls.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cls .t { display: flex; justify-content: space-between; gap: 8px; }
.cls .t b { font-family: var(--f-mono); font-size: .82rem; }
.cls .t span { color: var(--muted); font-size: .8rem; text-align: right; }
.cls .title { font-size: .85rem; }
.parts { display: flex; flex-wrap: wrap; gap: 6px; }
.part { font: inherit; font-size: .78rem; border: 1px dashed var(--muted); background: transparent; color: var(--ink); padding: 3px 8px; border-radius: 6px; cursor: pointer; text-align: left; }
.part.done { border-style: solid; border-color: var(--good); background: var(--good-soft); color: var(--good); }
.part.on { box-shadow: 0 0 0 2px var(--accent); }
.editor { border: 1px solid var(--accent); border-radius: 10px; padding: 12px; display: grid; gap: 12px; background: var(--panel); }
.editor label, .fieldlabel { display: grid; gap: 3px; font-size: .78rem; color: var(--muted); font-weight: 500; }
.editor select, .editor input[type=search] { font: inherit; font-size: .88rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
.opts { display: grid; gap: 4px; max-height: 250px; overflow-y: auto; padding-right: 2px; }
.optgrp { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin-top: 4px; }
.opt { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; align-items: center; font: inherit; font-size: .82rem; text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 5px 8px; cursor: pointer; }
.opt b { font-family: var(--f-mono); font-size: .78rem; }
.opt > span { display: grid; min-width: 0; }
.opt.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-soft); }
.opt .why { font-size: .76rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.checks { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .84rem; }
.checks li { padding: 5px 8px; border-radius: 6px; }
.checks .bad { background: var(--bad-soft); color: var(--bad); }
.checks .warn { background: var(--warn-soft); color: var(--warn); }
.checks .good { background: var(--good-soft); color: var(--good); }
.checks .info { background: var(--lunch); color: var(--ink); }
.who-free { display: flex; flex-wrap: wrap; gap: 4px; }
.who-free span { font-size: .76rem; padding: 2px 8px; border-radius: 999px; background: var(--good-soft); color: var(--good); }
.who-free span.full { background: var(--warn-soft); color: var(--warn); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ----- sign-in, people, approvals ----- */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); overflow: hidden; isolation: isolate; }
.login .uni::before { content: ""; position: absolute; z-index: -1; left: 50%; width: 200vw; transform: translateX(-50%); top: -100vh; bottom: 0; background: var(--navy); }
.login .box { position: relative; }
.login .box { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 14px; box-shadow: 0 10px 30px rgba(15,25,45,.12); }
.login h1 { font-size: 1.2rem; }
.login .uni { position: relative; color: #fff; text-align: center; padding-bottom: 56px; margin-bottom: -32px; font-family: var(--f-display); }
.login .uni b { display: block; font-size: 1.15rem; }
.login .loginseal { display: block; width: 104px; height: 104px; margin: 0 auto 12px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 8px 24px rgba(0,0,0,.25); }
.login .uni span { font-size: .82rem; opacity: .8; }
.form label, label.form { min-width: 0; }
.form select, label.form select { width: 100%; min-width: 0; }
.form input, .form select { font: inherit; font-size: .92rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
.readonly { background: var(--lunch); color: var(--ink); border-radius: 6px; padding: 7px 10px; font-size: .84rem; }
.block.pending, .block.rejected { border: 1px dashed #b07800; }
.block.rejected { border-color: var(--bad); }
.block .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: #c48a00; }
.block.rejected .dot { background: var(--bad); }
.legend i.pend { background: #fff; border: 1px dashed #b07800; position: relative; }
.misslist { max-height: 46vh; overflow-y: auto; display: grid; gap: 8px; }
.misslist h3 { font-size: .85rem; margin: 4px 0 2px; }
.misslist li { font-size: .84rem; }
.dialog textarea { font: inherit; font-size: .9rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 70px; resize: vertical; }
.avail th, .avail td { text-align: center; padding: 4px 3px; font-size: .74rem; }
.avail th:first-child, .avail td:first-child { text-align: left; white-space: nowrap; font-size: .82rem; }
.avail td.ok { background: var(--good-soft); color: var(--good); font-weight: 700; border: 2px solid var(--panel); border-radius: 4px; }
.avail td.no { color: var(--line); }
.avail tr.dept td { background: var(--bg); font-weight: 700; text-align: left; font-size: .82rem; }
.legend i.pend::after { content: ""; position: absolute; left: 2px; top: 2px; width: 6px; height: 6px; border-radius: 50%; background: #c48a00; }
.appr { display: inline-flex; gap: 4px; align-items: center; font-size: .78rem; white-space: nowrap; }
.appr.ok { color: var(--good); }
.appr.wait { color: var(--warn); }
.switch { display: flex; gap: 10px; align-items: center; font-size: .9rem; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }

/* ----- dialogs ----- */
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 28, .45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 40; }
.dialog { background: var(--panel); color: var(--ink); border-radius: 12px; border: 1px solid var(--line); padding: 18px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; display: grid; gap: 12px; }
.dialog label, .form label { display: grid; gap: 3px; font-size: .8rem; color: var(--muted); font-weight: 500; }
.dialog input, .form input { font: inherit; font-size: .9rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.dialog .choice { display: flex; gap: 8px; align-items: center; font-weight: 400; color: var(--ink); font-size: .9rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; align-items: start; }

/* ----- quiet motion: short, subtle feedback on hover and click ----- */
.rail .ic, .rail, .flyout button, .usermenu .pop button, .iconbtn, .avatar, .results button, .menu .pop button, .seg button, .pill, .btn, .kpi, .publish, .quick, .sugg, .topbar select, .search input {
  transition: background-color .16s ease, border-color .16s ease, color .16s ease, box-shadow .16s ease, transform .12s ease; }
.rail:active .ic, .flyout button:active, .seg button:active, .pill:active, .btn:active:not(:disabled), .publish:active:not(:disabled), .iconbtn:active, .avatar:active, .quick:active { transform: scale(.97); }
.rail:focus-visible, .flyout button:focus-visible, .seg button:focus-visible, .pill:focus-visible, .btn:focus-visible, .kpi:focus-visible, .quick:focus-visible, .iconbtn:focus-visible, .avatar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--accent-soft); color: var(--accent); }
.pill:hover:not([aria-pressed="true"]) { border-color: var(--accent); color: var(--accent); }
.btn.primary:hover:not(:disabled) { box-shadow: 0 2px 6px rgba(31,63,116,.25); }
.kpi:hover { box-shadow: 0 3px 10px rgba(15,25,45,.08); transform: translateY(-1px); }
.kpi:active { transform: translateY(0); }
.publish:hover:not(:disabled) { box-shadow: 0 2px 6px rgba(31,63,116,.25); }
/* menus and panels glide in and out instead of popping */
.flyout { opacity: 0; visibility: hidden; pointer-events: none; transform: translateX(-8px); transform-origin: left top;
  transition: opacity .16s ease, transform .2s var(--ease), visibility 0s linear .2s; }
.flyout.open { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition: opacity .16s ease, transform .2s var(--ease), visibility 0s; }
.flyout.open.sliding { transition: opacity .16s ease, transform .2s var(--ease), top .22s var(--ease), left .22s var(--ease), visibility 0s; }
.usermenu .pop { opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-6px) scale(.98); transform-origin: right top;
  transition: opacity .15s ease, transform .18s var(--ease), visibility 0s linear .18s; }
.usermenu .pop.open { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition: opacity .15s ease, transform .18s var(--ease), visibility 0s; }
.menu[open] .pop { animation: pop-up .16s var(--ease); }
.results:not([hidden]) { animation: drop-in .16s var(--ease); }
.waitlist[open] ul, .hownote[open] p { animation: drop-in .18s var(--ease); }
@keyframes pop-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes drop-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.snkids { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .24s var(--ease), opacity .2s ease; }
.snkids.shut { grid-template-rows: 0fr; opacity: 0; }
.snkids > div { overflow: hidden; min-height: 0; }
.main.enter > *, .wsmain.enter > * { animation: page-in .26s var(--ease) both; }
.main.enter > :nth-child(2), .wsmain.enter > :nth-child(2) { animation-delay: .03s; }
.main.enter > :nth-child(n+3), .wsmain.enter > :nth-child(n+3) { animation-delay: .06s; }
@keyframes page-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ----- progress ring ----- */
.ring { display: grid; grid-template-columns: 104px minmax(0, 1fr); align-items: center; gap: 18px; }
.ring svg { width: 104px; height: 104px; }
.ring .track { fill: none; stroke: #ebedf0; stroke-width: 8; }
.ring .fill { fill: none; stroke: var(--navy); stroke-width: 8; stroke-linecap: round; transition: stroke-dasharray .5s ease; }
.ring text { font-family: var(--f-body); font-size: 17px; font-weight: 400; fill: var(--navy); font-variant-numeric: tabular-nums; }
.ring b { display: block; font-weight: 700; font-size: 1rem; color: var(--ink); }
.ring strong { display: block; font-weight: 500; font-size: 1.45rem; line-height: 1.25; color: var(--navy); font-variant-numeric: tabular-nums; }
.ring span { color: var(--muted); font-size: .92rem; }
.ring.bad .fill { stroke: var(--bad); } .ring.bad text, .ring.bad strong { fill: var(--bad); color: var(--bad); }
.ring.small { grid-template-columns: 84px minmax(0, 1fr); gap: 14px; }
.ring.small svg { width: 84px; height: 84px; }

/* ----- home ----- */
.home { display: grid; gap: 22px; }
.hero { position: relative; height: 150px; margin: calc(-1 * var(--pt)) calc(-1 * var(--px)) 0; background: #e8ecf3; overflow: hidden; border-bottom: 1px solid var(--line); }
.hero .art { position: absolute; inset: 0 0 0 30%; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: 22px repeat(6, 1fr); gap: 6px; padding: 10px 24px 12px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 40%); mask-image: linear-gradient(90deg, transparent, #000 40%);
  background-image: linear-gradient(rgba(27,47,85,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(27,47,85,.07) 1px, transparent 1px); background-size: 100% 20px, calc((100% - 48px) / 6) 100%; background-position: 0 12px, 24px 0; }
.hero .art span { font-family: var(--f-mono); font-size: .62rem; letter-spacing: .12em; color: rgba(27,47,85,.38); align-self: center; padding-left: 4px; }
.hero .art i { border-radius: 6px; opacity: .85; }
.homehead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 20px; max-width: 1240px; width: 100%; margin: 0 auto; }
.homehead h1 { font-family: var(--f-display); font-size: 2rem; font-weight: 500; letter-spacing: -.01em; color: var(--ink); }
.homehead p { margin: 0; font-size: 1.15rem; color: var(--muted); }
.homebody { display: grid; gap: 22px; max-width: 1240px; width: 100%; margin: 0 auto; }
.quicks { display: flex; flex-wrap: wrap; gap: 10px; }
.quick { font: inherit; font-size: .9rem; font-weight: 500; color: var(--ink); background: var(--panel); border: 1px solid #b9c0cb; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
.quick:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.homecols { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.homecol { display: grid; gap: 22px; min-width: 0; }
.hcard { background: var(--panel); border-radius: 16px; padding: 22px 24px; display: grid; gap: 14px; box-shadow: 0 1px 2px rgba(15,25,45,.06), 0 2px 10px rgba(15,25,45,.04); min-width: 0; }
.hcard > h2 { font-size: 1.3rem; font-weight: 500; }
.hcard .caught { text-align: center; color: var(--muted); font-size: 1rem; padding: 10px 0 4px; margin: 0; }
.sugg { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 18px; border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; }
.sugg:hover { border-color: #c4cbd6; box-shadow: 0 2px 10px rgba(15,25,45,.06); }
.sugg .si { width: 48px; height: 48px; color: var(--accent); display: grid; place-items: center; }
.sugg.bad .si { color: var(--bad); }
.sugg.warn .si { color: var(--warn); }
.sugg b { display: block; font-weight: 500; font-size: 1.02rem; margin-bottom: 4px; }
.sugg p { margin: 0; color: var(--muted); font-size: .92rem; }
.sugg .go { font: inherit; font-weight: 500; font-size: .95rem; color: #1a66d6; background: none; border: 0; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; white-space: nowrap; }
.sugg .go:hover { color: var(--accent); }
.glance { display: grid; gap: 12px; }
.glance .big { display: flex; align-items: baseline; gap: 8px; }
.glance .big b { font-size: 2rem; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--navy); }

.glance dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; margin: 0; font-size: .92rem; }
.glance dt { color: var(--muted); }
.glance dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
.glance dd.bad { color: var(--bad); }
.news { display: grid; gap: 0; }
.news div { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-top: 1px solid var(--line2); }
.news div:first-child { border-top: 0; padding-top: 2px; }
.news i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 7px; }
.news i.good { background: var(--good); } .news i.warn { background: #c48a00; }
.news b { font-weight: 500; display: block; }
.news span { color: var(--muted); font-size: .84rem; }

/* ----- submissions ----- */
.sublist { gap: 0; padding: 4px 18px; }
.subrow { display: grid; grid-template-columns: minmax(170px, 1.1fr) minmax(0, 2fr) 150px 120px; gap: 6px 20px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line2); }
.subrow:first-child { border-top: 0; }

.substat { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-width: 0; }
.subprog { display: flex; align-items: center; gap: 10px; font-size: .88rem; font-variant-numeric: tabular-nums; }
.subprog small { display: block; color: var(--muted); font-size: .74rem; }
.subact { justify-self: end; }
.miniring { width: 34px; height: 34px; flex: none; }
.miniring .track { fill: none; stroke: #ebedf0; stroke-width: 4; }
.miniring .fill { fill: none; stroke: var(--navy); stroke-width: 4; stroke-linecap: round; }
.miniring.full .fill { stroke: var(--good); }
.waitlist { flex-basis: 100%; font-size: .84rem; color: var(--muted); }

.hownote p { margin: 8px 0 0; }
@media (max-width: 900px) { .subrow { grid-template-columns: minmax(0, 1fr) auto; } .substat { grid-column: 1 / -1; grid-row: 2; } .subact { grid-column: 2; grid-row: 1; } .subprog { grid-row: 3; } }

/* ----- workspace: section menu + light cards ----- */
.ws { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start; }
.ws.slim { grid-template-columns: 48px minmax(0, 1fr); }
.subnav { position: sticky; top: calc(var(--top) + 16px); background: var(--panel); border-radius: 14px; padding: 14px 10px; display: grid; gap: 2px; box-shadow: 0 1px 2px rgba(15,25,45,.06); }
.subnav.slim { padding: 4px; justify-items: center; }
.snhead { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 2px 4px 12px 8px; }
.snhead b { font-size: 1.15rem; font-weight: 500; }
.snicon { display: grid; place-items: center; color: var(--accent); }
.snicon svg { width: 22px; height: 22px; }
.snitem, .sngroup { display: flex; align-items: center; gap: 12px; width: 100%; font: inherit; text-align: left; border: 0; background: transparent; color: var(--ink); cursor: pointer; border-radius: 10px; }
.snitem { font-size: .92rem; padding: 9px 12px 9px 46px; }
.snitem.top { padding-left: 12px; font-weight: 500; font-size: .98rem; }
.sngroup { font-weight: 500; font-size: .98rem; padding: 10px 12px; margin-top: 4px; }
.sngroup i { margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-135deg); transition: transform .15s ease; }
.sngroup[aria-expanded="false"] i { transform: rotate(45deg); }
.snitem:hover, .sngroup:hover { background: var(--bg); }
.snitem[aria-current="page"] { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); font-weight: 500; }
.wsmain { display: grid; gap: 22px; min-width: 0; }
.notices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.notice { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 26px 28px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
.notice:has(> .ring) { grid-template-columns: minmax(0, 1fr); }
.notice .nicon { color: var(--accent); } .notice .nicon.bad { color: var(--bad); } .notice .nicon.warn { color: var(--warn); }
.notice .nicon svg { width: 56px; height: 56px; }
.notice h3 { font-size: 1.15rem; font-weight: 500; margin-bottom: 6px; }
.notice p { margin: 0 0 10px; color: var(--muted); }
.notice .go { font: inherit; font-weight: 500; color: #1a66d6; background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.ovtitle { font-size: 1.3rem; font-weight: 500; margin-top: 4px; }
.ovgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: stretch; }
.ovcard { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px 0; display: grid; grid-template-rows: auto 1fr auto; gap: 16px; min-width: 0; }
.ovhead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: start; }
.ovicon { color: var(--accent); width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; }
.ovhead h3 { font-size: 1.08rem; font-weight: 500; }
.ovhead p { margin: 2px 0 0; color: var(--muted); font-size: .88rem; }
.ovbody { display: grid; gap: 14px; align-content: start; min-width: 0; }
.ovline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; font-size: .9rem; }

function memoryStore() {
  const cols = {};

  const fire = (n) => (subs[n] || []).forEach((f) => f(snap(n)));
  return { collection: (n) => ({
    doc: (id) => ({ set: async (d) => { (cols[n] = cols[n] || {})[id] = d; fire(n); },
                    delete: async () => { delete (cols[n] || {})[id]; fire(n); } }),
    onSnapshot: (f) => { (subs[n] = subs[n] || []).push(f); setTimeout(() => f(snap(n))); return () => {}; } }) };
}

  }

  if (me.role === "chair" && dept !== me.department) return `View only: this class belongs to the Department of ${dept}.`;
  if (me.role !== "associate_dean" && me.role !== "chair") return "View only: the GE Coordinator schedules GE Department courses only.";

function teacherOf(cls) {

// ---------- the checks ----------

}
const hitsLunch = (c) => LUNCH[c.day] && c.start < LUNCH[c.day][1] && LUNCH[c.day][0] < c.end;
// Evaluate one way of booking a meeting. Returns [[level, text], ...]
function evaluate(cls, meeting, opt, room, teacherKey) {
  const out = [];
  const me = `${cls.id}|${meeting.part}`;
  const groups = meeting.kind === "supervision" ? [] : groupsOf(cls.section);
  const sec = DATA.sections[cls.section];
  const cands = opt.iv.map(([day, start, end]) => ({ day, start, end }));
  if (opt.ex) out.push(["warn", `Outside the time frame: ${opt.ex}`]);
  cands.forEach((c) => {
    if (hitsLunch(c)) out.push(["bad", `Lunch: ${c.day} ${hm(LUNCH[c.day][0])}–${hm(LUNCH[c.day][1])} is kept free of classes`]);
    if (sec.placement.includes(c.day) && meeting.kind !== "supervision") out.push(["bad", `Practicum: ${cls.section} is at practicum placement on ${c.day}`]);
    sessions.forEach((s) => {
      if (`${s.cls.id}|${s.part}` === me || !overlaps(s, c)) return;
      const shared = groups.filter((g) => s.groups.includes(g));
      if (shared.length) out.push(["bad", `Students: ${shared.join(", ")} already have ${s.cls.course} ${PART[s.part]} ${s.day} ${hm(s.start)}–${hm(s.end)}`]);
    });
    if (teacherKey && meeting.kind !== "nstp") teacherBusy(teacherKey, c, cls.id).forEach((s) =>
      out.push(["bad", `Teacher: ${DATA.teachers[teacherKey].name} teaches ${s.cls.course} (${s.cls.section}) ${s.day} ${hm(s.start)}–${hm(s.end)}`]));
    if (room) {
      const busy = roomBusy(room, c, me);
      if (busy.length >= DATA.rooms[room].cap)
        out.push(["bad", `Room: ${room} is booked ${c.day} ${hm(busy[0].start)}–${hm(busy[0].end)} by ${busy.map((s) => `${s.cls.course} (${s.cls.section})`).join(", ")}`]);
    }
  });
  if (meeting.pools.some((p) => p) && !room) out.push(["bad", "Choose a room"]);

    const perDay = {};
    sessions.filter((s) => s.tkey === teacherKey && s.kind !== "nstp" && `${s.cls.id}|${s.part}` !== me)
      .concat(cands).forEach((s) => perDay[s.day] = (perDay[s.day] || 0) + (s.end - s.start));
    cands.forEach((c) => {
      const h = perDay[c.day] / 60;
      if (h > DATA.facMax) out.push(["bad", `Teacher: ${h.toFixed(1)} teaching hours on ${c.day} (limit ${DATA.facMax})`]);
      else if (h > DATA.facPref) out.push(["warn", `Teacher: ${h.toFixed(1)} teaching hours on ${c.day} (time frame advises at most ${DATA.facPref})`]);
    });
  }
  if (meeting.kind === "lab" && room && DATA.rooms[room].blocks.length && !DATA.rooms[room].blocks.includes(opt.block))
    out.push(["warn", `${room} is assigned blocks ${DATA.rooms[room].blocks.join(", ")} in the time frame`]);
  if (meeting.kind === "lab") {
    const pref = DATA.labDays.find((p) => p.college === DATA.programs[sec.program].college && p.year === sec.year);
    if (pref && !(pref.blocks.includes(opt.block) && pref.days.includes(cands[0].day)))
      out.push(["warn", `CISC guidance: Year ${sec.year} labs on ${pref.days.join("/")} ${pref.blocks.join("/")}`]);
  }
  const other = cls.meetings.filter((m) => m.part !== meeting.part).map((m) => bookings[`${cls.id}|${m.part}`]).filter(Boolean);
  other.forEach((b) => {
    const o = findOpt(cls.meetings.find((m) => m.part === b.part).kind, b.pattern);
    const same = o ? o.iv.map((i) => i[0]).filter((d) => cands.some((c) => c.day === d)) : [];
    if (same.length) out.push(["warn", `Double period: the ${PART[b.part].toLowerCase()} of ${cls.course} is also on ${same.join(", ")}`]);
  });

  return out.filter(([, t]) => !seen.has(t) && seen.add(t));
}
function roomsFor(meeting) { return Object.entries(DATA.rooms).filter(([, r]) => meeting.pools.includes(r.pool)).map(([n]) => n); }
function freeRooms(cls, meeting, opt) {

// Conflicts that slipped in (two people booking at once): re-check every pair.
function findClashes() {

    const a = sessions[i], b = sessions[j];

    if (a.groups.some((g) => b.groups.includes(g))) out.push([a, b, "students"]);
    if (a.tkey && a.tkey === b.tkey && a.kind !== "nstp" && b.kind !== "nstp") out.push([a, b, "teacher"]);

const sLabel = (s) => `${s.cls.course}${s.part === "Lab" ? " Lab" : s.part === "Lec" ? "" : " " + PART[s.part]} · ${s.cls.section}`;
const dayList = (ss) => [...new Set(ss.map((s) => s.day))].sort((a, b) => DAYS.indexOf(a) - DAYS.indexOf(b)).join("/");

function computeConflicts() {

  const bad = opts.bad || share > 1;

// The part a department does itself, still incomplete: its major classes and the GE classes it
// teaches, with no time, no room, or no teacher. Mirrors dept_missing(). Borrowed GE classes are
// booked after the lending departments submit, and GE Department courses are left out.
function missingFor(dept) {
  const out = [];
  DATA.classes.filter((c) => progDept(c.section) === dept && ["major", "own"].includes(classKind(c)) && c.meetings.length).forEach((c) => {
    const issues = [];
    c.meetings.forEach((m) => {
      const b = bookings[`${c.id}|${m.part}`];
      if (!b) issues.push(`${PART[m.part].toLowerCase()} has no time`);
      else if (m.pools.some((p) => p) && !b.room) issues.push(`${PART[m.part].toLowerCase()} has no room`);
    });
    if (!teacherOf(c)) issues.push("no teacher");
    if (issues.length) out.push({ cls: c, issues });
  });
  return out;
}
// Borrowed GE classes of a department still without an approved instructor from another department.
function waitingFor(dept) {
  return DATA.classes.filter((c) => progDept(c.section) === dept && classKind(c) === "borrowed")
    .map((c) => ({ cls: c, a: approvalOf(c) || { state: "unscheduled" } })).filter((x) => x.a.state !== "approved");
}
// A short description: "2 SOCS 195 classes waiting for Economics, 1 HIST 201 class not asked yet".
function waitingText(list) {
  const groups = {};
  list.forEach(({ cls, a }) => {
    const what = a.state === "unscheduled" ? "not booked yet" : a.state === "unasked" ? "booked without an instructor" : a.state === "rejected" ? `not approved by ${a.dept}` : `waiting for ${a.dept}`;
    const k = `${cls.course}|${what}`;
    groups[k] = (groups[k] || 0) + 1;
  });
  return Object.entries(groups).map(([k, n]) => { const [course, what] = k.split("|"); return `${n} ${course} class${n > 1 ? "es" : ""} ${what}`; }).join(", ");
}
const myDept = () => (BACKEND && me.role === "chair" ? me.department : null);

// Has anything of the department changed since it submitted?
function changedSince(dept) {
  const sub = submissions?.[dept];
  if (!sub) return false;

  return Object.values(bookings).some((b) => mine(b.class) && Date.parse(b.at) > t0)
      || Object.values(assigned).some((a) => mine(a.class) && Date.parse(a.at) > t0);
}

async function doSubmit(dept) {
  const miss = missingFor(dept);
  const reason = null;
  if (miss.length) { $("submsg").textContent = "Finish the unscheduled courses first."; return; }
  const list = miss.map((x) => ({ course: x.cls.course, section: x.cls.section, issues: x.issues }));
  const { error } = await sb.rpc("submit_schedule", { d: dept, reason, missing_list: list });
  if (error) { $("submsg").textContent = sbMessage(error); return; }
  $("submitPanel").hidden = true;

  toast(`Submitted. The other departments can now see that ${dept} is ${miss.length ? "done, with notes" : "done"}.`);

// A small ring for lists: the share done, no text inside.
function miniRing(done, total) {
  const share = total ? Math.min(1, done / total) : 0, r = 15, c = 2 * Math.PI * r;
  return `<svg class="miniring${share === 1 ? " full" : ""}" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="${r}" class="track"/>${share > 0 ? `<circle cx="18" cy="18" r="${r}" class="fill" stroke-dasharray="${(share * c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 18 18)"/>` : ""}</svg>`;
}

function editor(cls, part) {

    const when = `${o.iv.map((i) => i[0]).join("/")} ${hm(o.iv[0][1])}–${hm(o.iv[0][2])}`;
    return { o, html: `<button type="button" class="opt${d.pattern === o.label ? " on" : ""}" data-opt="${esc(o.label)}"><b>${esc(o.label)}</b><span><span class="small">${when}</span><span class="why">${esc(why)}</span></span>${chip}</button>`, group: o.ex ? "Outside the time frame (needs approval)" : o.label.includes("TTh") || ["Tue", "Thu"].includes(o.iv[0][0]) ? "Tuesday / Thursday" : o.iv[0][0] === "Sat" ? "Saturday" : "Monday / Wednesday / Friday" };
  });
  const groups = {};

      : `<div style="display:grid;gap:4px"><label for="teacherSel">Teacher${t?.key ? "" : " (no teacher yet)"}</label>

      askSel = `<label for="askSel" style="grid-column:span 2">Instructor (from a department that teaches ${esc(cls.course)})
        <select id="askSel"${right ? " disabled" : ""}><option value="">Choose an instructor</option>${list.map((x) => !x.submitted
          ? `<optgroup label="${esc(x.dept)} (${esc(x.college)}): not submitted yet"></optgroup>`

              `<option value="${esc(x.dept)}|${k}"${`${x.dept}|${k}` === val ? " selected" : ""}${full(k) ? " disabled" : ""}>${esc(DATA.teachers[k].name)} · ${luFor(k)}/${DATA.teachers[k].max} LU${full(k) ? " · full load" : ""}</option>`).join("")}</optgroup>`).join("")}

      <ul class="checks">${checks.length ? checks.map(([l, txt]) => `<li class="${l}">${esc(txt)}</li>`).join("") : `<li class="good">No conflicts. Students, teacher, and room are all free.</li>`}</ul>
      <div class="actions">${borrowed && tRight && d.askTeacher === "*" ? `<button type="button" class="btn primary" data-act="askinstr">Send instructor request</button>`

  }
  return `<div class="editor"><div><h3>${esc(cls.course)} ${esc(PART[part])} · ${esc(cls.section)}</h3>

// The chart as a tree of people: each node is a person (or an open position) and the people who report to them.
// VPAA -> Dean, support unit heads, VPAA Office; Dean -> Associate Deans, GE Coordinator, Office of the Dean;
// Associate Dean -> department chairs, college office; chair -> department faculty; GE Coordinator -> Philosophy
// faculty, area coordinators (-> their area), GE office; unit head -> unit staff.
function orgTree() {
  const O = DATA.org, nodes = {};
  const add = (id, x, unit, parent) => {
    if (!x) return null;
    const n = { id, ...x, unit, parent: parent?.id || null, children: [] };
    nodes[id] = n; if (parent) parent.children.push(n);
    return n;
  };
  const pid = (x) => x.key ? `f:${x.key}` : `s:${x.email || x.name || x.title}`;
  const staffNode = (x, unit, parent) => add(pid(x), x.name ? x : { ...x, name: x.title, title: "Positions", open: true }, unit, parent);
  const root = add("vpaa", orgHead(O.vpaa), "Office of the Vice President for Academic Affairs", null);
  const dean = add("dean", orgHead(O.dean), "Office of the Dean", root);
  Object.entries(O.colleges).forEach(([c, u]) => {
    const ad = add(`f:${u.associate_dean.faculty}`, { ...orgFac(u.associate_dean.faculty, "Associate Dean"), credentials: u.associate_dean.credentials }, DATA.colleges[c], dean);
    if (!ad) return;
    orgDepts(c).forEach((d) => {
      const chair = d.chair ? add(pid(d.chair), d.chair, `Department of ${d.name}`, ad) : null;
      d.people.forEach((x) => add(pid(x), x, `Department of ${d.name}`, chair || ad));
    });
    u.staff.map(orgStaff).forEach((x) => staffNode(x, `${DATA.colleges[c]} office`, ad));
  });
  const ge = add(`f:${O.ge.coordinator.faculty}`, { ...orgFac(O.ge.coordinator.faculty, "GE Coordinator"), credentials: O.ge.coordinator.credentials }, DATA.colleges.GE, dean);
  O.ge.areas.forEach((a) => {
    const people = a.faculty.map((k) => orgFac(k)).filter(Boolean);
    const lead = /led by the GE Coordinator/i.test(a.note || "") ? null : people.find((x) => x.title !== "Faculty");
    const head = lead ? add(pid(lead), lead, a.name, ge) : ge;
    people.filter((x) => x !== lead).forEach((x) => add(pid(x), x, a.name, head));
  });
  O.ge.staff.map(orgStaff).forEach((x) => staffNode(x, "GE Department office", ge));
  O.offices[1].staff.map(orgStaff).forEach((x) => staffNode(x, "Office of the Dean", dean));
  O.support_units.forEach((u) => {
    const h = add(`u:${u.key}`, orgHead(u.head), u.name, root);
    u.staff.forEach((x) => staffNode(x.faculty ? orgStaff(x) : orgStaff(x), u.name, h));
  });
  O.offices[0].staff.map(orgStaff).forEach((x) => staffNode(x, "VPAA Office", root));
  return nodes;
}
function orgPath(nodes, id) { const out = []; for (let n = nodes[id]; n; n = nodes[n.parent]) out.unshift(n); return out; }

// Moving through the chart. Down: the clicked card drops out of its row while the rows above slide up and away,
// then its team falls into place below it. Up: the team slides down and away and the parent comes down from above.
function orgGo(id, highlight) {
  const old = state.orgFocus, nodes = orgTree();
  const up = orgPath(nodes, old).some((n) => n.id === id && n.id !== old);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const oldChart = $("orgChart");
  const sel = (root, pid) => root?.querySelector(`[data-person="${CSS.escape(pid)}"]`);
  // 1. Keep a picture of the chart as it is, to animate away.
  let ghost = null, from = null;
  if (!reduce && oldChart) {
    const r = oldChart.getBoundingClientRect();
    from = (up ? sel(oldChart, old) : sel(oldChart, id))?.getBoundingClientRect() || null;
    ghost = oldChart.cloneNode(true);
    ghost.removeAttribute("id"); ghost.querySelectorAll("[id]").forEach((e) => e.removeAttribute("id"));
    ghost.setAttribute("aria-hidden", "true");
    const moving = up ? sel(ghost, old) : sel(ghost, id);
    if (moving) moving.style.visibility = "hidden";            // that card is drawn by the new chart instead
    Object.assign(ghost.style, { position: "fixed", left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, margin: "0", zIndex: "0", pointerEvents: "none" });
  }
  // 2. Draw the new chart, with the chosen person on top.
  state.orgFocus = id; render();
  const chart = $("orgChart");
  if (!chart) return;
  const barH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--top")) || 64;
  const chartTop = chart.getBoundingClientRect().top;
  if (chartTop < barH || chartTop > innerHeight * .5) { scrollBy({ top: chartTop - barH - 12, behavior: "instant" }); if (ghost && from) { const d = chartTop - barH - 12; ghost.style.top = `${parseFloat(ghost.style.top) - d}px`; from = new DOMRect(from.x, from.y - d, from.width, from.height); } }
  if (reduce || !ghost) return orgHighlight(highlight);
  const clipTop = Math.max(barH, chart.getBoundingClientRect().top - 8);
  const frame = document.createElement("div");
  frame.setAttribute("aria-hidden", "true");
  Object.assign(frame.style, { position: "fixed", left: "0", right: "0", top: `${clipTop}px`, bottom: "0", overflow: "hidden", zIndex: "0", pointerEvents: "none" });
  ghost.style.top = `${parseFloat(ghost.style.top) - clipTop}px`; ghost.style.position = "absolute";
  frame.appendChild(ghost); document.body.appendChild(frame);
  const ease = "cubic-bezier(.22,.8,.24,1)", T = 560;
  const focusCard = chart.querySelector(".ocard.focus");
  const kids = [...chart.querySelectorAll(".okids > *")];
  const lines = [...chart.querySelectorAll(".otrunk, .okids")];
  if (!up) {
    // Like scrolling down the tree: everything travels up together. The old rows go a little faster and fade
    // under the top edge, so the clicked card drops out of its row; its team rises into view right behind it.
    const to = focusCard.getBoundingClientRect();
    const rise = from ? Math.max(0, from.top - to.top) : 0;
    const dx = from ? from.left + from.width / 2 - (to.left + to.width / 2) : 0;
    ghost.animate([{ transform: "none", opacity: 1 }, { transform: `translateY(${-(rise + 120)}px)`, opacity: 0 }], { duration: T, easing: ease, fill: "forwards" });
    if (from) focusCard.animate([{ transform: `translate(${dx}px, ${rise}px) scale(${from.width / to.width})` }, { transform: "none" }], { duration: T, easing: ease });
    chart.querySelector(".oup")?.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, delay: T - 220, fill: "backwards" });
    lines.forEach((el) => el.animate([{ opacity: 0, transform: `translateY(${rise + 60}px)` }, { opacity: 1, transform: "none" }], { duration: T, easing: ease }));
    kids.forEach((el, i) => el.animate([{ opacity: 0, transform: `translateY(${rise + 60 + Math.floor(i / 5) * 24}px)` }, { opacity: 1, transform: "none" }],
      { duration: T + 60, delay: Math.min(i, 14) * 12, easing: ease, fill: "backwards" }));
  } else {
    // Going up: the old team slides down and away; the old top card settles back into its row; the parent comes down.
    ghost.animate([{ transform: "none", opacity: 1 }, { transform: "translateY(160px)", opacity: 0 }], { duration: T, easing: ease, fill: "forwards" });
    const back = sel(chart.querySelector(".okids"), old);
    if (back && from) { const to = back.getBoundingClientRect();
      back.animate([{ transform: `translate(${from.left + from.width / 2 - (to.left + to.width / 2)}px, ${from.top - to.top}px) scale(${from.width / to.width})`, zIndex: 5 }, { transform: "none", zIndex: 5 }], { duration: T, easing: ease }); }
    focusCard.animate([{ opacity: 0, transform: "translateY(-60px)" }, { opacity: 1, transform: "none" }], { duration: 460, easing: ease, fill: "backwards" });
    kids.filter((el) => el !== back).forEach((el, i) => el.animate([{ opacity: 0, transform: "translateY(-24px)" }, { opacity: 1, transform: "none" }],
      { duration: 380, delay: 160 + Math.floor(i / 5) * 70 + (i % 5) * 30, easing: ease, fill: "backwards" }));
  }
  setTimeout(() => frame.remove(), T + 40);
  orgHighlight(highlight);
}

async function decide(cid, decision) {
  let note = null, teacher = null;
  if (decision === "reject") { note = window.prompt("Reason (shown to the department that booked it):", ""); if (note === null) return false; }
  if (decision === "approve") {
    const sel = $(`apT-${cid}`);
    teacher = sel ? sel.value || null : null;
    if (sel && !teacher) { toast(`Choose a teacher for ${CLASS[cid].course} ${CLASS[cid].section} first.`); return false; }
  }
  const { error } = await sb.rpc("decide_ge", { cid, decision, note, teacher });
  if (error) { toast(sbMessage(error)); return false; }
  return true;
}

// ---------- actions ----------
function openPick(clsId, part) {
  const cls = CLASS[clsId];
  if (!cls) return;
  const b = bookings[`${clsId}|${part}`];
  const m = cls.meetings.find((x) => x.part === part);
  state.pick = { cls: clsId, part };
  teacherQuery = "";
  const t = teacherOf(cls);
  state.draft = { pattern: b?.pattern || (m.kind === "nstp" ? optionsFor("nstp")[0]?.label : null), room: b?.room || "", teacher: t?.key || "", askDept: "", askTeacher: "" };
  if (classKind(cls) === "borrowed" && requestOf(cls)) {    // the instructor asked before
    state.draft.askDept = requestOf(cls).department; state.draft.askTeacher = t?.key || "*";
  }
  // Jump to the class's own section on the booking desk.
  const sec = DATA.sections[cls.section];
  state.view = "timetable"; state.college = DATA.programs[sec.program].college; state.program = sec.program; state.section = cls.section;
  if (state.scope !== "ALL" && state.scope !== "GE" && state.scope !== state.college) state.scope = "ALL";
  if (state.scope === "GE") state.scope = "ALL";
}
function choosePattern(label) {
  state.draft.pattern = label;
  const cls = CLASS[state.pick.cls]; const m = cls.meetings.find((x) => x.part === state.pick.part);
  const opt = findOpt(m.kind, label);
  if (state.draft.room && !freeRooms(cls, m, opt).includes(state.draft.room)) state.draft.room = "";
  if (!state.draft.room && m.pools.some((p) => p)) state.draft.room = homeFirst(cls, freeRooms(cls, m, opt))[0] || "";
  if (classKind(cls) === "borrowed" && state.draft.askTeacher && state.draft.askTeacher !== "*") {   // keep the instructor only if still free then
    const pick = askable(cls, opt).find((x) => x.dept === state.draft.askDept);
    if (!pick?.submitted || !pick.free.includes(state.draft.askTeacher)) { state.draft.askDept = ""; state.draft.askTeacher = ""; }
  }
}
function openSection(s) {
  const sec = DATA.sections[s];
  state.view = "timetable"; state.pick = null; state.draft = null;
  state.college = DATA.programs[sec.program].college; state.program = sec.program; state.section = s;
  if (state.scope !== "ALL" && state.scope !== state.college) state.scope = "ALL";
}
// A class dropped on the dashboard timetable: open it at the allowed time that starts nearest the drop point.
function dropAt(clsId, part, day, minute) {
  const cls = CLASS[clsId]; const m = cls?.meetings.find((x) => x.part === part);
  if (!m) return;
  const fits = optionsFor(m.kind).filter((o) => o.iv.some(([d, s, e]) => d === day && s <= minute && minute < e))
    .sort((a, b) => (a.ex ? 1 : 0) - (b.ex ? 1 : 0) || Math.abs(a.iv.find((i) => i[0] === day)[1] - minute) - Math.abs(b.iv.find((i) => i[0] === day)[1] - minute));
  openPick(clsId, part);
  if (fits.length) choosePattern(fits[0].label);
  else toast(`No allowed time for ${cls.course} ${PART[part].toLowerCase()} on ${day} at ${hm(minute)}. Choose one from the list.`);
}
let toastTimer = null;
function toast(text) { const t = $("toast"); t.textContent = text; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 4200); }
async function save() {
  const cls = CLASS[state.pick.cls], part = state.pick.part, d = state.draft;
  const msg = $("msg");
  if (sb) {
    try {
      if ((d.teacher || "") !== (teacherOf(cls)?.key || "")) {
        const r = !d.teacher
          ? await sb.from("teacher_changes").delete().eq("class_id", cls.id)
          : await sb.from("teacher_changes").upsert({ class_id: cls.id, sem: DATA.semester, teacher: d.teacher || null });
        if (r.error) throw r.error;
      }
      if (classKind(cls) === "borrowed" && !isAdmin() || classKind(cls) === "borrowed" && d.askTeacher && d.askTeacher !== "*") {
        const q = await sb.rpc("book_borrowed", { cid: cls.id, meeting: part, slot: d.pattern, place: d.room || null, d: d.askDept, t: d.askTeacher });
        if (q.error) throw q.error;
      } else {
        const r = await sb.from("bookings").upsert({ class_id: cls.id, part, sem: DATA.semester, pattern: d.pattern, room: d.room || null });
        if (r.error) throw r.error;
      }
      await Promise.all([sbLoad.bookings(), sbLoad.teacher_changes(), sbLoad.ge_requests(), sbLoad.ge_decisions(), sbLoad.instructor_requests()]);
      rebuild(); render();
      const m2 = $("msg"); if (m2) { m2.textContent = "Saved."; m2.className = "msg good"; }
    } catch (err) { const m2 = $("msg") || msg; if (m2) { m2.textContent = sbMessage(err); m2.className = "msg bad"; } const b = document.querySelector('[data-act="save"]'); if (b) b.disabled = false; }
    return;
  }
  const me = user ? await user.id() : null;
  try {
    const plan = "";                       // every class starts with no teacher
    if ((d.teacher || "") !== (teacherOf(cls)?.key || "")) {
      if ((d.teacher || "") === plan) await store.collection("teachers").doc(docId(DATA.semester, cls.id)).delete();
      else await store.collection("teachers").doc(docId(DATA.semester, cls.id)).set({ sem: DATA.semester, class: cls.id, course: cls.course, section: cls.section, teacher: d.teacher || null, by: me, at: new Date().toISOString() });
    }
    await store.collection("bookings").doc(docId(DATA.semester, cls.id, part)).set({ sem: DATA.semester, class: cls.id, course: cls.course,
      section: cls.section, part, pattern: d.pattern, room: d.room || null, by: me, at: new Date().toISOString() });
    if (!shared) savedAt.bookings = new Date().toISOString();
    const m2 = $("msg"); if (m2) { m2.textContent = "Saved."; m2.className = "msg good"; }
  } catch (err) {
    if (msg) { msg.textContent = err?.code === "invalid_argument" ? "You have view-only access, so bookings can't be saved." : "Could not save. Try again."; msg.className = "msg bad"; }
  }
}
async function removeBooking() {
  const cls = CLASS[state.pick.cls];
  if (sb && classKind(cls) === "borrowed") {
    const { error } = await sb.rpc("unbook_borrowed", { cid: cls.id });
    if (error) { const msg = $("msg"); if (msg) { msg.textContent = sbMessage(error); msg.className = "msg bad"; } return; }
    await Promise.all([sbLoad.bookings(), sbLoad.teacher_changes(), sbLoad.ge_requests(), sbLoad.ge_decisions()]);
    state.draft.pattern = null; rebuild(); render(); return;
  }

  }
  try { await store.collection("bookings").doc(docId(DATA.semester, cls.id, state.pick.part)).delete(); state.draft.pattern = null; render(); }
  catch (err) { const msg = $("msg"); if (msg) { msg.textContent = "Could not remove. Try again."; msg.className = "msg bad"; } }
}

const SEARCH = [].concat(
  Object.keys(DATA.sections).map((s) => ({ kind: "Section", label: s, sub: DATA.programs[DATA.sections[s].program].name, go: () => openSection(s) })),
  Object.entries(DATA.teachers).map(([k, t]) => ({ kind: "Faculty", label: t.name, sub: `${t.dept} · ${t.college}`, go: () => { state.view = "faculty"; state.teacher = k; if (!teacherInScope(k)) state.scope = "ALL"; } })),
  Object.entries(DATA.rooms).map(([n, r]) => ({ kind: "Room", label: n, sub: `${roomKind(r)} · ${DATA.buildings[r.building] || r.building}`, go: () => { state.view = "rooms"; state.room = n; if (!roomInScope(n)) state.scope = "ALL"; } })),
  [...new Set(DATA.classes.map((c) => c.course))].map((code) => ({ kind: "Course", label: `${code} ${DATA.courses[code].title}`, sub: `${DATA.classes.filter((c) => c.course === code).length} sections`,
    go: () => { const c = DATA.classes.find((x) => x.course === code); if (isGE(code)) { state.scope = "GE"; state.view = "courses"; } else { state.scope = "ALL"; state.view = "courses"; state.program = DATA.sections[c.section].program; } } })),

let searchHits = [], searchOn = 0;
function runSearch(q) {
  const box = $("results");
  q = q.trim().toLowerCase();
  if (!q) { box.hidden = true; return; }
  const words = q.split(/\s+/);
  searchHits = SEARCH.filter((x) => words.every((w) => `${x.label} ${x.sub}`.toLowerCase().includes(w))).slice(0, 14);
  searchOn = 0;
  box.hidden = false;
  box.innerHTML = searchHits.length ? searchHits.map((x, i) => `<button type="button" data-hit="${i}" class="${i === 0 ? "on" : ""}"><small>${x.kind}</small><span>${esc(x.label)}<em>${esc(x.sub)}</em></span></button>`).join("")
    : `<p class="empty" style="padding:8px">No matches.</p>`;
}
function goHit(i) { const h = searchHits[i]; if (!h) return; h.go(); if (!allowedScopes().includes(state.scope)) state.scope = allowedScopes()[0]; state.pick = null; $("results").hidden = true; $("search").value = ""; render(); window.scrollTo(0, 0); }

document.addEventListener("click", async (ev) => {

  if (ds.usermenu) { setUserMenu(!userMenuOpen); return; }
  if (ds.openpublish) { openPublish(); return; }
  if (ds.view) { flyKey = null; userMenuOpen = false; }
