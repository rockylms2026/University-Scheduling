    title: "ROOM SCHEDULE", name: room,
    info: [["Room", room], ["Building", DATA.buildings[r.building] || r.building], ["Type", type],
           ["Assigned to", r.college === "SHARED" ? "Shared facility" : DATA.colleges[r.college]], ["Weekly use", `${hours.toFixed(1)} of ${39 * r.cap} teaching hours`]],
    head: ["Days", "Time", "Course code", "Descriptive title", "Section", "Instructor"],
    widths: [52, 96, 72, 230, 70, null],
    rows, sessions: list,
    cell: (s) => [s.cls.course + (s.part === "Lab" ? " (Lab)" : ""), s.cls.section, s.tkey ? shortName(s.tkey) : "TBA"],
    off: [],
    signs: [["Prepared by", printCfg.preparedBy, printCfg.preparedTitle], ["Noted by", "", r.college === "SHARED" ? "Vice President for Academic Affairs" : `Dean, ${DATA.colleges[r.college]}`]],
  };
}

function drawSheet(doc, sheet) {
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 40;
  let y = M;
  doc.setTextColor(0); doc.setDrawColor(0);
  const center = (text, size, style = "normal") => { doc.setFont("times", style); doc.setFontSize(size); doc.text(text, W / 2, y, { align: "center" }); };
  if (SEAL) { try { doc.addImage(SEAL, "PNG", M, M - 14, 56, 56); } catch (e) {} }
  if (printCfg.university) { center(printCfg.university.toUpperCase(), 14, "bold"); y += 16; }
  if (printCfg.office) { center(printCfg.office, 11); y += 15; }
  y += 4;
  center(sheet.title, 13, "bold"); y += 14;
  center(`First Semester, Academic Year ${printCfg.ay}`, 10.5, "italic"); y += 9;
  doc.setLineWidth(0.8); doc.line(M, y, W - M, y); doc.setLineWidth(0.3); doc.line(M, y + 2.5, W - M, y + 2.5);
  y += 16;
  // Information block, two columns.
  doc.setFontSize(10);
  const colW = (W - 2 * M) / 2;
  for (let i = 0; i < sheet.info.length; i += 2) {      // label/value pairs, two per line, values wrap
    let lines = 1;
    [sheet.info[i], sheet.info[i + 1]].forEach((pair, j) => {
      if (!pair) return;
      const x = M + j * colW, wrapped = doc.splitTextToSize(String(pair[1]), colW - 118);
      doc.setFont("times", "bold"); doc.text(`${pair[0]}:`, x, y);
      doc.setFont("times", "normal"); doc.text(wrapped, x + 112, y);
      lines = Math.max(lines, wrapped.length);
    });
    y += lines * 12 + 2;
  }
  y += 2;
  // Class list.
  doc.autoTable({
    startY: y, head: [sheet.head], body: sheet.rows.length ? sheet.rows : [[{ content: "No classes scheduled.", colSpan: sheet.head.length }]],
    theme: "grid", margin: { left: M, right: M },
    styles: { font: "times", fontSize: 8.5, textColor: 0, lineColor: 0, lineWidth: 0.4, cellPadding: 3, valign: "top" },
    headStyles: { fillColor: [255, 255, 255], textColor: 0, fontStyle: "bold", halign: "center", lineWidth: 0.6 },
    columnStyles: Object.fromEntries(sheet.widths.map((w, i) => [i, w ? { cellWidth: w } : {}])),
  });
  y = doc.lastAutoTable.finalY + 14;
  // Weekly timetable grid.
  const rows = (DATA.end - DATA.start) / DATA.slot;
  const signH = 52;
  let rowH = Math.min(15, (H - M - signH - y - 22) / rows);
  if (rowH < 10) { doc.addPage(); y = M; center(`${sheet.title} (continued): ${sheet.name}`, 10.5, "bold"); y += 16; rowH = Math.min(20, (H - M - signH - y - 22) / rows); }
  doc.setFont("times", "bold"); doc.setFontSize(10); doc.text("Weekly timetable", M, y); y += 6;
  const timeW = 62, dayW = (W - 2 * M - timeW) / DAYS.length, top = y + 14;
  doc.setLineWidth(0.6); doc.rect(M, y, W - 2 * M, 14 + rows * rowH);
  doc.setFontSize(9);
  doc.text("Time", M + timeW / 2, y + 10, { align: "center" });
  DAYS.forEach((d, i) => doc.text({ Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday" }[d], M + timeW + dayW * (i + 0.5), y + 10, { align: "center" }));
  doc.line(M, top, W - M, top);
  doc.setLineWidth(0.2); doc.setDrawColor(150);
  for (let r = 1; r < rows; r++) doc.line(M + timeW, top + r * rowH, W - M, top + r * rowH);
  doc.setDrawColor(0); doc.setLineWidth(0.4);
  for (let i = 0; i <= DAYS.length; i++) doc.line(M + timeW + dayW * i, y, M + timeW + dayW * i, top + rows * rowH);
  doc.setFont("times", "normal"); doc.setFontSize(7.5);
  for (let r = 0; r < rows; r++) {
    const m = DATA.start + r * DATA.slot;
    if (r % 2 === 0) { doc.text(`${hm(m)}–${hm(m + 60)}`, M + timeW / 2, top + r * rowH + rowH * 0.75, { align: "center" }); doc.setDrawColor(0); doc.setLineWidth(0.3); if (r) doc.line(M, top + r * rowH, M + timeW, top + r * rowH); }
  }
  const yOf = (m) => top + ((m - DATA.start) / DATA.slot) * rowH;
  doc.setFont("times", "italic"); doc.setFontSize(7.5);
  DAYS.forEach((d, i) => {
    const x = M + timeW + dayW * i;
    if (sheet.off.includes(d)) {
      doc.setFillColor(255, 255, 255); doc.rect(x + 0.4, top + 0.4, dayW - 0.8, rows * rowH - 0.8, "F");
      doc.text("Practicum placement", x + dayW / 2, top + rows * rowH / 2, { align: "center" }); return;
    }
    if (LUNCH[d]) {          // a clear band, no grid lines, labelled
      const y1 = yOf(LUNCH[d][0]), y2 = yOf(LUNCH[d][1]);
      doc.setFillColor(255, 255, 255); doc.rect(x + 0.4, y1 + 0.3, dayW - 0.8, y2 - y1 - 0.6, "F");
      doc.setDrawColor(0); doc.setLineWidth(0.2); doc.setLineDashPattern([1.5, 1.5], 0);
      doc.line(x, y1, x + dayW, y1); doc.line(x, y2, x + dayW, y2); doc.setLineDashPattern([], 0);
      doc.text("LUNCH BREAK", x + dayW / 2, (y1 + y2) / 2 + 2.5, { align: "center" });
    }
  });
  DAYS.forEach((d, i) => {
    const day = sheet.sessions.filter((s) => s.day === d).sort((a, b) => a.start - b.start);
    const lanes = [];
    day.forEach((s) => { let k = lanes.findIndex((e) => e <= s.start); if (k < 0) { k = lanes.length; lanes.push(0); } lanes[k] = s.end; s._pl = k; });
    day.forEach((s) => {
      const n = Math.max(1, day.filter((o) => o.start < s.end && s.start < o.end).reduce((a, o) => Math.max(a, o._pl + 1), 0));
      const w = dayW / n, x = M + timeW + dayW * i + s._pl * w, y1 = yOf(s.start), h = yOf(s.end) - y1;
      doc.setFillColor(255, 255, 255); doc.setDrawColor(0); doc.setLineWidth(0.7);
      doc.rect(x + 1.2, y1 + 1, w - 2.4, h - 2, "FD");
      const lines = sheet.cell(s).filter(Boolean);
      const maxLines = Math.max(1, Math.floor((h - 3) / 8));
      lines.slice(0, maxLines).forEach((ln, j) => {
        doc.setFont("times", j === 0 ? "bold" : "normal"); doc.setFontSize(j === 0 ? 7.5 : 7);
        doc.text(doc.splitTextToSize(ln, w - 5)[0], x + w / 2, y1 + 8.5 + j * 8, { align: "center" });
      });
    });
  });
  // Signatures.
  let sy = top + rows * rowH + 30;
  if (sy + 30 > H - 20) { doc.addPage(); sy = M + 40; }
  const sw = (W - 2 * M) / sheet.signs.length;
  sheet.signs.forEach(([label, name, title], i) => {
    const x = M + i * sw + 10;
    doc.setFont("times", "normal"); doc.setFontSize(9.5); doc.text(`${label}:`, x, sy - 18);
    doc.setLineWidth(0.5); doc.line(x, sy, x + sw - 40, sy);
    if (name) { doc.setFont("times", "bold"); doc.text(name.toUpperCase(), x + (sw - 40) / 2, sy - 3, { align: "center" }); }
    doc.setFont("times", "italic"); doc.setFontSize(9); doc.text(title || "", x + (sw - 40) / 2, sy + 11, { align: "center" });
  });
}

async function makePdf() {
  const { ids, label } = readPrintForm();
  if (!window.jspdf?.jsPDF || !window.jspdf.jsPDF.API.autoTable) { renderPrintPanel("The PDF tools did not load. Check the connection and reopen the page.", true); return; }
  const doc = new window.jspdf.jsPDF({ orientation: "landscape", unit: "pt", format: "letter" });
  const build = { section: sectionSheet, teacher: teacherSheet, room: roomSheet }[printJob.kind];
  ids.forEach((id, i) => { if (i) doc.addPage(); drawSheet(doc, build(id)); });
  const pages = doc.getNumberOfPages(), W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const stamp = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i); doc.setFont("times", "italic"); doc.setFontSize(8); doc.setTextColor(0);
    doc.text(`Printed ${stamp}`, 40, H - 18); doc.text(`Page ${i} of ${pages}`, W - 40, H - 18, { align: "right" });
  }
  const name = label || (printJob.kind === "teacher" ? DATA.teachers[ids[0]].name : ids[0]);
  const filename = `${{ section: "Class schedule", teacher: "Teaching schedule", room: "Room schedule" }[printJob.kind]} - ${name}.pdf`.replace(/[\\/:*?"<>|]/g, "-");
  const result = await saveFile(filename, doc.output("blob"));
  renderPrintPanel(result, !/^(Saved|Created|Not saved)/.test(result));
}
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-pact]");
  if (!t) { if (ev.target.id === "printPanel") { printJob = null; renderPrintPanel(); } if (ev.target.id === "publishPanel") $("publishPanel").hidden = true; return; }
  if (t.dataset.pact === "cancel") { printJob = null; renderPrintPanel(); }
  if (t.dataset.pact === "make") { t.disabled = true; makePdf().finally(() => { const b = document.querySelector('[data-pact="make"]'); if (b) b.disabled = false; }); }
});

// ---------- start ----------
if (SEAL) $("topSeal").src = SEAL; else $("topSeal").hidden = true;
if (BACKEND) { $("app").hidden = true; startHosted().catch((e) => { loginMsg = "Could not reach the server: " + e.message; showLogin("signin"); }); }
else rebuild(), render();
if (!BACKEND) (async () => {
  let db = null;
  if (window.claude?.use) {
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { db = null; }
  }
  if (db) {
    store = db; shared = true;
    const can = user ? await user.can("data.write") : null;
    canWrite = can !== false;
  } else {
    store = memoryStore(); shared = false; canWrite = true;
  }
  listen();
})();
</script>
