:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --ink: #18202b;
  --muted: #5d6877;
  --line: #dde2e9;
  --accent: #1f4fd1;
  --accent-ink: #ffffff;
  --accent-soft: #e5ecfd;
  --lunch: #eef0f4;
  --warn: #9a6400;
  --warn-soft: #fff3cf;
  --bad: #b42318;
  --bad-soft: #fde4e1;
  --good: #1d7a46;
  --good-soft: #def4e6;
  --c-css: #d8e6fb;   --c-css-ink: #1b4a8f;
  --c-cisc: #d5f0de;  --c-cisc-ink: #17643a;
  --c-cbe: #fde6c8;   --c-cbe-ink: #8a4c05;
  --c-coe: #e8dcfa;   --c-coe-ink: #5a2f9a;
  --c-ccjps: #f9d9d9; --c-ccjps-ink: #8f2424;

  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --row: 26px;
}

    --warn: #f2c35b; --warn-soft: #3a2f12; --bad: #ff9b8f; --bad-soft: #3d1a17; --good: #6fd39a; --good-soft: #15301f;
    --c-css: #1d3352; --c-css-ink: #b9d3ff;
    --c-cisc: #183a27; --c-cisc-ink: #a9e8c0;
    --c-cbe: #43301a; --c-cbe-ink: #f8d3a3;
    --c-coe: #33244d; --c-coe-ink: #d8c4fa;
    --c-ccjps: #4a2222; --c-ccjps-ink: #f6c0c0;
    --c-core: #262d37; --c-core-ink: #ccd3dd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --panel: #181e26; --ink: #e6eaf0; --muted: #9aa5b4; --line: #2a323d;
  --accent: #8fb0ff; --accent-ink: #0d1424; --accent-soft: #1d2a4a; --lunch: #1c222b;
  --warn: #f2c35b; --warn-soft: #3a2f12; --bad: #ff9b8f; --bad-soft: #3d1a17; --good: #6fd39a; --good-soft: #15301f;
  --c-css: #1d3352; --c-css-ink: #b9d3ff;
  --c-cisc: #183a27; --c-cisc-ink: #a9e8c0;
  --c-cbe: #43301a; --c-cbe-ink: #f8d3a3;
  --c-coe: #33244d; --c-coe-ink: #d8c4fa;
  --c-ccjps: #4a2222; --c-ccjps-ink: #f6c0c0;
  --c-core: #262d37; --c-core-ink: #ccd3dd;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1400px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: .92rem; }
.status { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: .8rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.banner { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: .9rem; }
.banner b { font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { font: inherit; font-size: .9rem; border: 0; background: transparent; color: var(--muted); padding: 7px 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.main.wide { grid-template-columns: minmax(0, 1fr); }
.finder { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-rows: auto minmax(0, 1fr); max-height: calc(100vh - 140px); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.finder input { font: inherit; margin: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.list { overflow-y: auto; padding: 0 6px 10px; }
.grp { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 8px 4px; font-weight: 600; }
.item { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: .9rem; border: 0; background: transparent; color: var(--ink); padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.item:hover { background: var(--bg); }
.item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.item small { color: var(--muted); font-family: var(--f-mono); font-size: .75rem; font-variant-numeric: tabular-nums; }
.board { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.who h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; margin: 0; }
.who p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; max-width: 75ch; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 8px; font-size: .85rem; }
.facts b { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.week { display: grid; grid-template-columns: 52px repeat(var(--days), minmax(96px, 1fr)); min-width: 640px; padding-bottom: 10px; }
.dayhead { font-family: var(--f-display); font-weight: 500; font-size: .85rem; text-align: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.dayhead.off { color: var(--muted); text-decoration: line-through; }
.times { position: relative; }
.times span { position: absolute; right: 6px; transform: translateY(-50%); font-family: var(--f-mono); font-size: .68rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.col { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); background-size: 100% calc(var(--row) * 2); }
.col.off { background-color: var(--bg); }
.lunch { position: absolute; left: 0; right: 0; background: var(--lunch); display: flex; align-items: center; justify-content: center; font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.away { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; font-size: .78rem; color: var(--muted); }
.block { position: absolute; left: 3px; right: 3px; border-radius: 6px; padding: 3px 6px; overflow: hidden; font-size: .74rem; line-height: 1.25; cursor: pointer; border: 1px solid transparent; text-align: left; font-family: var(--f-body); }
.block strong { display: block; font-family: var(--f-mono); font-size: .74rem; font-weight: 600; }
.block span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.block.sel { box-shadow: 0 0 0 2px var(--accent); }
.block.ex { border: 1.5px dashed var(--warn); background-image: repeating-linear-gradient(135deg, transparent 0 6px, var(--warn-soft) 6px 9px); }
.block.pending { border: 1.5px dashed var(--accent); }
.block.ghost { pointer-events: none; z-index: 2; background: var(--panel); color: var(--accent); border: 2px dashed var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.k-CSBS { background-color: var(--c-css); color: var(--c-css-ink); }
.k-CILS { background-color: var(--c-cisc); color: var(--c-cisc-ink); }
.k-CBAPA { background-color: var(--c-cbe); color: var(--c-cbe-ink); }
.k-COE { background-color: var(--c-coe); color: var(--c-coe-ink); }
.k-CORE { background-color: var(--c-core); color: var(--c-core-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.legend i.ex { border: 1.5px dashed var(--warn); }
.legend i.pending { border: 1.5px dashed var(--accent); }
.detail { border-top: 1px solid var(--line); padding-top: 12px; font-size: .9rem; min-height: 3.2em; display: grid; gap: 10px; }
.detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: inherit; font-size: .88rem; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.editor { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; background: var(--bg); }
.editor label { display: grid; gap: 3px; font-size: .82rem; color: var(--muted); }
.editor select, .editor input, .editor textarea { font: inherit; font-size: .9rem; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.checks { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .86rem; }
.checks li { padding: 5px 8px; border-radius: 6px; }
.checks .bad { background: var(--bad-soft); color: var(--bad); }
.checks .warn { background: var(--warn-soft); color: var(--warn); }
.checks .good { background: var(--good-soft); color: var(--good); }
.hint { color: var(--muted); }
.msg { font-size: .86rem; }
.msg.bad { color: var(--bad); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: .9rem; }
@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .finder { position: static; max-height: 260px; }
}
@media (prefers-reduced-motion: no-preference) { .block { transition: box-shadow .12s; } }
</style>

    if (LUNCH[c.day] && c.start < LUNCH[c.day][1] && LUNCH[c.day][0] < c.end) issues.push(["bad", `${c.day}: runs through lunch`]);
    c.groups.forEach((g) => (placements[g] || []).forEach(([code, days]) => {
      if (days.includes(c.day)) issues.push(["bad", `${g} is at ${code} placement on ${c.day}`]);
    }));
    all.forEach((o) => {
      if (!overlaps(c, o)) return;
      const shared = c.groups.filter((g) => o.groups.includes(g));
      if (shared.length) issues.push(["bad", `Students of ${shared.join(", ")} have ${o.code} (${o.section}) ${o.day} ${hm(o.start)}–${hm(o.end)}`]);
      if (teacherKey && o.tkey === teacherKey && o.part !== "NSTP" && c.part !== "NSTP")
        issues.push(["bad", `${DATA.teachers[teacherKey].name} teaches ${o.code} (${o.section}) ${o.day} ${hm(o.start)}–${hm(o.end)}`]);
    });
    if (c.room) {
      const cap = DATA.rooms[c.room]?.cap || 1;
      const busy = all.filter((o) => o.room === c.room && overlaps(c, o));
      if (busy.length >= cap) issues.push(["bad", `${c.room} is booked ${c.day} by ${busy.map((o) => `${o.code} (${o.section})`).join(", ")}`]);
    }
  });
  if (teacherKey) {
    const perDay = {};
    all.concat(cands).forEach((s) => { if (s.tkey === teacherKey && s.part !== "NSTP") perDay[s.day] = (perDay[s.day] || 0) + (s.end - s.start); });
    cands.forEach((c) => { if (!c.tkey) perDay[c.day] = (perDay[c.day] || 0) + (c.end - c.start); });
    Object.entries(perDay).forEach(([d, m]) => {
      if (m > DATA.maxTeachHours * 60) issues.push(["bad", `${DATA.teachers[teacherKey].name} would teach ${(m / 60).toFixed(1)} h on ${d} (limit ${DATA.maxTeachHours})`]);
      else if (m > 6 * 60) issues.push(["warn", `${DATA.teachers[teacherKey].name} would teach ${(m / 60).toFixed(1)} h on ${d} (more than 6)`]);
    });
  }
  const seen = new Set();
  return issues.filter(([, t]) => !seen.has(t) && seen.add(t));
}

// ---------- lists ----------
function viewsList() {
  const sem = semChanges(state.sem).length;
  return [["groups", "Student groups"], ["teachers", "Teachers"], ["rooms", "Rooms"],
          ["unstaffed", `Unstaffed (${unstaffed().length})`], ["approval", `Needs approval (${approvals().length})`],
          ["changes", `Changes (${sem})`]];
}
function approvals() {
  const seen = new Map();
  effective().forEach((s) => { if (s.exception) seen.set(s.key, s); });
  return [...seen.values()];
}
function unstaffed() {
  const seen = new Map();
  effective().forEach((s) => { if (!s.tkey && !s.newTeacher && s.part !== "Supervision") seen.set(`${s.code}|${s.section}`, s); });
  return [...seen.values()].sort((a, b) => a.code.localeCompare(b.code) || a.section.localeCompare(b.section, undefined, { numeric: true }));
}
function roomGroup(pool) {
  if (pool.startsWith("classrooms:")) return pool.split(":")[1] + " classrooms";
  if (pool === "shared") return "Lingkod Hall overflow";
  if (pool.startsWith("seminar:")) return "Seminar rooms";
  if (pool === "pe") return "PE venues";
  return "Laboratories";
}
function entities() {
  const all = effective();
  if (state.view === "groups") {
    const count = {};
    all.forEach((s) => s.groups.forEach((g) => count[g] = (count[g] || 0) + (s.end - s.start)));
    return Object.keys(count).map((g) => ({ id: g, name: g, group: DATA.groups[g].college, meta: `${Math.round(count[g] / 60)} h` }));
  }
  if (state.view === "teachers") {
    return Object.entries(DATA.teachers).map(([k, t]) => ({ id: k, name: t.name, group: t.college, meta: `${t.lu[state.sem] ?? 0} LU` }));
  }
  const mins = {};
  all.forEach((s) => { if (s.room && s.day !== "Sat") mins[s.room] = (mins[s.room] || 0) + (s.end - s.start); });
  return Object.entries(DATA.rooms).map(([r, info]) => ({
    id: r, name: r, group: roomGroup(info.pool), meta: `${Math.round(100 * (mins[r] || 0) / (39 * 60 * info.cap))}%` }));
}

function renderBoard() {

  } else if (state.view === "teachers") {
    mine = all.filter((s) => s.tkey === id);
    const t = DATA.teachers[id];
    const perDay = {};
    mine.forEach((s) => { if (s.part !== "NSTP") perDay[s.day] = (perDay[s.day] || 0) + (s.end - s.start) / 60; });
    head = `<h2>${esc(t.name)}</h2><p>${esc(t.rank)} · ${esc(t.dept)} (${esc(t.college)})${t.role ? " · " + esc(t.role) : ""}</p>
      <div class="facts"><span><b>${t.lu[state.sem] ?? 0}</b> of ${t.max} LU</span>

      <span><i class="k-CORE"></i>General education</span><span><i class="ex"></i>Needs approval</span><span><i class="pending"></i>Changed, not yet rebuilt</span></div>
    <div class="detail" id="detail"></div>`;

function weekGrid(list, offDays) {
  const rows = (DATA.end - DATA.start) / ROW_MIN;
  const px = (m) => `calc(var(--row) * ${(m - DATA.start) / ROW_MIN})`;
  const len = (a, b) => `calc(var(--row) * ${(b - a) / ROW_MIN})`;
  const preview = state.edit?.type === "move" ? state.edit.cands || [] : [];
  let html = `<div class="week" style="--days:${DAYS.length}"><div></div>`;
  html += DAYS.map((d) => `<div class="dayhead${offDays.includes(d) ? " off" : ""}">${d}</div>`).join("");
  html += `<div class="times" style="height:calc(var(--row) * ${rows})">`;
  for (let m = DATA.start; m <= DATA.end; m += 60) html += `<span style="top:${px(m)}">${hm(m)}</span>`;
  html += `</div>`;
  DAYS.forEach((d) => {
    html += `<div class="col${offDays.includes(d) ? " off" : ""}" style="height:calc(var(--row) * ${rows})">`;
    if (LUNCH[d]) html += `<div class="lunch" style="top:${px(LUNCH[d][0])};height:${len(...LUNCH[d])}">Lunch</div>`;
    if (offDays.includes(d)) html += `<div class="away">At placement</div>`;
    list.filter((s) => s.day === d).forEach((s) => {
      const line2 = state.view === "groups" ? (s.room || (s.part === "NSTP" ? "Grounds" : "")) : s.section;
      const line3 = state.view === "teachers" ? (s.room || "") : (s.tkey ? shortName(s.tkey) : s.newTeacher || "TBA");
      const part = s.part === "Lec" ? "" : " · " + s.part;
      const cls = [`k-${s.college}`, s.exception && s.decision !== "approved" ? "ex" : "", s.pending || s.assignPending ? "pending" : "",
                   state.sel === s.key ? "sel" : ""].filter(Boolean).join(" ");
      html += `<button type="button" class="block ${cls}" data-key="${esc(s.key)}"
        style="top:${px(s.start)};height:calc(${len(s.start, s.end)} - 2px)" title="${esc(s.code + " " + s.title)}">
        <strong>${esc(s.code)}${esc(part)}</strong><span>${esc(line2)}</span><span>${esc(line3)}</span></button>`;
    });
    preview.filter((c) => c.day === d).forEach((c) => {
      html += `<div class="block ghost" style="top:${px(c.start)};height:calc(${len(c.start, c.end)} - 2px)"><strong>${esc(c.code)}</strong><span>New time</span></div>`;
    });
    html += `</div>`;
  });
  return html + `</div>`;
}
function shortName(key) { const p = DATA.teachers[key].name.split(" "); return p[0] + " " + p[p.length - 1]; }
function teacherLabel(s) { return s.tkey ? DATA.teachers[s.tkey].name : s.tba; }

function moveEditor(s) {
  const e = state.edit;
  const opts = DATA.options[s.kind] || [];
  if (!e.pattern) { e.pattern = s.label; e.room = s.room || ""; }
  const opt = opts.find((o) => o.label === e.pattern);
  // Rooms that can hold this class, free ones first for the chosen time.
  const others = effective().filter((o) => o.key !== s.key && o.room);
  const rooms = Object.entries(DATA.rooms).filter(([, r]) => s.pools.includes(r.pool)).map(([n, r]) => {
    const busy = opt ? opt.iv.some(([day, start, end]) =>
      others.filter((o) => o.room === n && overlaps({ day, start, end }, o)).length >= r.cap) : false;
    return { n, busy };
  }).sort((a, b) => a.busy - b.busy || a.n.localeCompare(b.n, undefined, { numeric: true }));
  e.cands = opt ? opt.iv.map(([day, start, end]) => ({ ...s, day, start, end, room: e.room || null })) : [];
  const checks = opt ? checkPlacement(e.cands, s.key, s.tkey) : [];
  if (opt?.ex) checks.unshift(["warn", `Outside the time frame: ${opt.ex}`]);
  if (s.pools.some((p) => p) && !e.room) checks.unshift(["bad", "Choose a room"]);
  const ok = !checks.some(([lvl]) => lvl === "bad");
  return `<div class="editor"><strong>Move ${esc(s.code)} ${esc(PART_NAME[s.part] || s.part)} for ${esc(s.section)}</strong>
    <div class="fields">
      <label for="movePattern">New time
        <select id="movePattern">${opts.map((o) => `<option value="${esc(o.label)}"${o.label === e.pattern ? " selected" : ""}>${esc(o.label)} · ${o.iv.map((i) => i[0]).join("/")} ${hm(o.iv[0][1])}–${hm(o.iv[0][2])}${o.ex ? " (exception)" : ""}</option>`).join("")}</select></label>
      ${s.pools.some((p) => p) ? `<label for="moveRoom">Room
        <select id="moveRoom"><option value="">Choose a room</option>${rooms.map((r) => `<option value="${esc(r.n)}"${r.n === e.room ? " selected" : ""}>${esc(r.n)}${r.busy ? " (busy)" : " (free)"}</option>`).join("")}</select></label>` : ""}
      <label for="moveNote">Note (optional)<input id="moveNote" value="${esc(e.note || "")}" placeholder="Reason for the change"></label>
    </div>
    <ul class="checks">${checks.length ? checks.map(([l, t]) => `<li class="${l}">${esc(t)}</li>`).join("") : `<li class="good">No conflicts: students, teacher, and room are all free.</li>`}</ul>
    <div class="actions"><button type="button" class="btn primary" data-act="saveMove"${ok ? "" : " disabled"}>Save change</button>
      <button type="button" class="btn" data-act="cancel">Cancel</button><span class="msg" id="editMsg"></span></div></div>`;
}

function assignEditor(s) {
  const e = state.edit;
  const ss = sessionsOf(s.key);
  const all = sessionsOf(s.key).concat(effective().filter((x) => x.code === s.code && x.section === s.section && x.key !== s.key));
  const avail = availableTeachers(s, all);
  let checks = [];
  if (e.teacher && e.teacher !== "__new") {
    const cands = all.map((x) => ({ ...x, tkey: e.teacher }));
    checks = checkPlacement(cands, null, e.teacher).filter(([, t]) => !t.startsWith("Students") && !t.includes(" is booked "));
    const t = DATA.teachers[e.teacher];
    const lu = (t.lu[state.sem] ?? 0) + (s.kind === "lab" || s.kind === "lab_lecture" ? 5 : 3);
    if (lu > t.max) checks.push(["warn", `${t.name} would carry ${lu} LU (limit ${t.max})`]);
  }
  if (e.teacher === "__new" && !(e.newTeacher || "").trim()) checks.push(["bad", "Type the new teacher's name"]);
  if (!e.teacher) checks.push(["bad", "Choose a teacher"]);
  const ok = !checks.some(([lvl]) => lvl === "bad");
  const option = ([k, t]) => `<option value="${esc(k)}"${k === e.teacher ? " selected" : ""}>${esc(t.name)} · ${esc(t.dept)} · ${t.lu[state.sem] ?? 0}/${t.max} LU</option>`;
  const group = (label, list) => list.length ? `<optgroup label="${esc(label)}">${list.map(option).join("")}</optgroup>` : "";
  // Keep a teacher who is already chosen in the list even if now busy.
  const chosenBusy = e.teacher && e.teacher !== "__new" && !avail.all.includes(e.teacher) && DATA.teachers[e.teacher]
    ? group("Chosen (not free at this time)", [[e.teacher, DATA.teachers[e.teacher]]]) : "";
  const opts = chosenBusy + group(`Free · ${avail.homeLabel}`, avail.home) + group("Free · other departments", avail.other)
    + group("Free · already at their load limit", avail.full);
  return `<div class="editor"><strong>Teacher for ${esc(s.code)} ${esc(s.section)}</strong>
    <div class="fields">
      <label for="assignTeacher">Teacher (${avail.all.length} free at ${esc(ss.map((x) => x.day).join("/"))} ${hm(s.start)}–${hm(s.end)}${avail.busy ? `; ${avail.busy} busy not shown` : ""})
        <select id="assignTeacher"><option value="">Choose a teacher</option>${opts}<option value="__new"${e.teacher === "__new" ? " selected" : ""}>New part-time teacher…</option></select></label>
      ${e.teacher === "__new" ? `<label for="newTeacher">Name of the new teacher<input id="newTeacher" value="${esc(e.newTeacher || "")}" placeholder="e.g. Ms. Ana Cruz"></label>` : ""}
      <label for="assignNote">Note (optional)<input id="assignNote" value="${esc(e.note || "")}"></label>
    </div>
    <ul class="checks">${checks.length ? checks.map(([l, t]) => `<li class="${l}">${esc(t)}</li>`).join("") : `<li class="good">This teacher is free at every meeting of this class.</li>`}</ul>
    <div class="actions"><button type="button" class="btn primary" data-act="saveAssign"${ok ? "" : " disabled"}>Save change</button>
      <button type="button" class="btn" data-act="cancel">Cancel</button><span class="msg" id="editMsg"></span></div></div>`;
}

// Teachers free at every meeting of a class, grouped for the dropdown.
function availableTeachers(s, meetings) {
  const own = `${s.code}|${s.section}`;
  const byTeacher = {};
  effective().forEach((o) => {
    if (o.tkey && o.part !== "NSTP" && `${o.code}|${o.section}` !== own) (byTeacher[o.tkey] = byTeacher[o.tkey] || []).push(o);
  });
  const addLU = DATA.courses[s.code] && meetings.some((m) => m.part === "Lab") ? 5 : 3;
  // The unit that usually teaches the course, e.g. "Dept. of Secondary Education (COE)".
  const usual = s.tba ? s.tba.replace(/^TBA \(|\)$/g, "").replace(/^GE Department$/, "General Education")
    : s.tkey ? DATA.teachers[s.tkey].dept : "";
  const home = [], other = [], full = [], all = [];
  let busy = 0;
  Object.entries(DATA.teachers).forEach(([k, t]) => {
    const mine = byTeacher[k] || [];
    if (meetings.some((m) => mine.some((o) => overlaps(m, o)))) { busy++; return; }
    const perDay = {};
    mine.concat(meetings).forEach((o) => perDay[o.day] = (perDay[o.day] || 0) + (o.end - o.start));
    if (meetings.some((m) => perDay[m.day] > DATA.maxTeachHours * 60)) { busy++; return; }
    all.push(k);
    const entry = [k, t];
    if ((t.lu[state.sem] ?? 0) + addLU > t.max) full.push(entry);
    else if (usual && usual.includes(t.dept)) home.push(entry);
    else other.push(entry);
  });
  const byLoad = (a, b) => ((a[1].lu[state.sem] ?? 0) - (b[1].lu[state.sem] ?? 0)) || a[1].name.localeCompare(b[1].name);
  [home, other, full].forEach((l) => l.sort(byLoad));
  return { home, other, full, all, busy, homeLabel: usual ? `usually taught by ${usual}` : "same department" };
}

async function writeChange(id, body) {
  const me = user ? await user.id() : null;
  try {
    await db.collection("changes").doc(id).set({ ...body, sem: Number(state.sem), by: me, at: new Date().toISOString() });
    return true;
  } catch (err) {
    const m = $("editMsg");
    const text = err?.code === "quota_exceeded" ? "The change list is full. Ask Claude to apply the pending changes first."
      : err?.code === "invalid_argument" ? "You have view-only access, so changes can't be saved." : "Could not save. Try again.";
    if (m) { m.textContent = text; m.className = "msg bad"; }
    return false;
  }
}

// ---------- other tabs ----------
function renderApproval(board) {
  const list = approvals();
  const sem = DATA.sems[state.sem];
  board.innerHTML = `<div class="who"><h2>Needs approval</h2>
    <p>These classes could only be placed by bending the University Class Time Frame, because of a conflict in the plans. Approve one as is, or ask for another time; select a row to see it.</p></div>
    ${list.length ? `<div class="scroll"><table><thead><tr><th>Course</th><th>Section</th><th>When</th><th>Teacher</th><th>Reason</th><th>Decision</th></tr></thead><tbody>
    ${list.map((s) => `<tr><td><button type="button" class="btn" data-pick="${esc(s.key)}">${esc(s.code)}</button> ${esc(s.title)}</td><td>${esc(s.section)}</td><td class="num">${esc(s.label)} ${hm(s.start)}–${hm(s.end)}</td>
      <td>${esc(teacherLabel(s))}</td><td>${esc(s.exception)}</td><td>${s.decision ? (s.decision === "approved" ? "Approved" : "Another time") : "Pending"}</td></tr>`).join("")}</tbody></table></div>`
    : `<p class="hint">Every class follows the time frame this semester.</p>`}
    ${sem.problems.length ? `<div class="note"><b>Rule problems found by the independent check:</b><br>${sem.problems.map(esc).join("<br>")}</div>` : ""}
    <div class="detail" id="detail"></div>`;
  renderDetail();
}

function renderUnstaffed(board) {
  const list = unstaffed();
  const by = {};
  list.forEach((s) => (by[s.code] = by[s.code] || []).push(s));
  board.innerHTML = `<div class="who"><h2>Unstaffed sections</h2>
    <p>No college or GE Department plan names a teacher for these sections. Each still has a time and a room. Select a section to assign a teacher; the check shows whether that teacher is free at the section's time.</p>
    <div class="facts"><span><b>${list.length}</b> sections</span><span><b>${Object.keys(by).length}</b> courses</span></div></div>
    <div class="detail" id="detail"></div>
    <div class="scroll"><table><thead><tr><th>Course</th><th>Usually taught by</th><th>Sections</th></tr></thead><tbody>
    ${Object.entries(by).map(([code, ss]) => `<tr><td><b>${esc(code)}</b><br><span class="hint">${esc(ss[0].title)}</span></td>
      <td>${esc(ss[0].tba.replace(/^TBA \(|\)$/g, ""))}</td>
      <td><div class="actions">${ss.map((s) => `<button type="button" class="btn" data-pick="${esc(s.key)}" title="${esc(s.label + " " + hm(s.start))}">${esc(s.section)}</button>`).join("")}</div></td></tr>`).join("")}
    </tbody></table></div>`;
  renderDetail();
}

async function renderChanges(board) {
  const list = semChanges(state.sem).slice().sort((a, b) => String(b.at).localeCompare(String(a.at)));
  board.innerHTML = `<div class="who"><h2>Changes</h2>
    <p>Saved by anyone with access, for everyone. They show on the timetable right away and are built into it, with a full re-check of every rule, when Claude next rebuilds the timetable.</p></div>
    ${list.length ? `<div class="scroll"><table><thead><tr><th>Change</th><th>Class</th><th>Details</th><th>By</th><th>When</th><th></th></tr></thead><tbody>
    ${list.map((c) => `<tr><td>${c.type === "move" ? "Move" : c.type === "assign" ? "Teacher" : c.decision === "approved" ? "Approved" : "Another time"}</td>
      <td><button type="button" class="btn" data-pick="${esc(mkey(c.course, c.section, c.part || firstPart(c)))}">${esc(c.course)} ${esc(c.section)}</button></td>
      <td>${esc(changeDetail(c))}</td><td data-uid="${esc(c.by || "")}">…</td><td class="num">${esc(String(c.at || "").slice(0, 16).replace("T", " "))}</td>
      <td>${canWrite ? `<button type="button" class="btn" data-act="undo" data-doc="${esc(c.id)}">Undo</button>` : ""}</td></tr>`).join("")}
    </tbody></table></div>` : `<p class="hint">No saved changes for this semester.</p>`}
    <div class="detail" id="detail"></div>`;
  renderDetail();
  if (user && list.length) {
    const ids = [...new Set(list.map((c) => c.by).filter(Boolean))];
    const ps = await user.profiles(ids);
    document.querySelectorAll("[data-uid]").forEach((td) => { td.textContent = ps[td.dataset.uid]?.name || "Someone"; });
  } else {
    document.querySelectorAll("[data-uid]").forEach((td) => { td.textContent = "Someone"; });
  }
}
function firstPart(c) {
  const s = effective().find((x) => x.code === c.course && x.section === c.section);
  return s ? s.part : "Lec";
}
function changeDetail(c) {
  if (c.type === "move") return `${c.part} to ${c.pattern}${c.room ? " in " + c.room : ""}${c.note ? " · " + c.note : ""}`;
  if (c.type === "assign") return `${c.teacher ? DATA.teachers[c.teacher]?.name || c.teacher : c.newTeacher + " (new part-time)"}${c.note ? " · " + c.note : ""}`;
  return c.note || "";
}

function render() { effCache = {}; renderTop(); renderList(); renderBoard(); save(); }

// ---------- events ----------
document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button");
  if (!t) return;
  if (t.dataset.sem) { state.sem = t.dataset.sem; state.sel = null; state.edit = null; render(); return; }
  if (t.dataset.view) { state.view = t.dataset.view; state.sel = null; state.edit = null; render(); return; }
  if (t.classList.contains("item")) { state.pick[state.view] = t.dataset.id; state.sel = null; state.edit = null; renderList(); renderBoard(); save(); return; }
  if (t.dataset.key) { state.sel = t.dataset.key; state.edit = null; renderBoard(); return; }
  if (t.dataset.pick) { state.sel = t.dataset.pick; state.edit = null; renderBoard(); $("detail")?.scrollIntoView({ block: "nearest", behavior: "smooth" }); return; }
  const act = t.dataset.act;
  if (!act) return;
  const s = state.sel ? sessionsOf(state.sel)[0] : null;
  if (act === "move" && s) { state.edit = { type: "move", key: s.key }; renderBoard(); }
  else if (act === "assign" && s) { state.edit = { type: "assign", key: s.key, teacher: s.tkey || (s.newTeacher ? "__new" : ""), newTeacher: s.newTeacher || "" }; renderBoard(); }
  else if (act === "cancel") { state.edit = null; renderBoard(); }
  else if (act === "saveMove" && s) {
    const e = state.edit;
    t.disabled = true;
    if (await writeChange(docId("move", state.sem, s.code, s.section, s.part),
        { type: "move", course: s.code, section: s.section, part: s.part, pattern: e.pattern, room: e.room || null, note: e.note || "" })) state.edit = null;
  } else if (act === "saveAssign" && s) {
    const e = state.edit;
    t.disabled = true;
    const body = { type: "assign", course: s.code, section: s.section, note: e.note || "" };
    if (e.teacher === "__new") body.newTeacher = e.newTeacher.trim(); else body.teacher = e.teacher;
    if (await writeChange(docId("assign", state.sem, s.code, s.section), body)) state.edit = null;
  } else if ((act === "approve" || act === "reject") && s) {
    await writeChange(docId("approve", state.sem, s.code, s.section, s.part),
      { type: "approve", course: s.code, section: s.section, part: s.part, decision: act === "approve" ? "approved" : "another_time", note: "" });
  } else if (act === "undo") {
    try { await db.collection("changes").doc(t.dataset.doc).delete(); } catch (err) { t.textContent = "Could not undo"; }
  }
});
document.addEventListener("change", (ev) => {
  const e = state.edit;
  if (!e) return;
  if (ev.target.id === "movePattern") { e.pattern = ev.target.value; renderBoard(); }
  else if (ev.target.id === "moveRoom") { e.room = ev.target.value; renderBoard(); }
  else if (ev.target.id === "assignTeacher") { e.teacher = ev.target.value; renderBoard(); }
});
document.addEventListener("input", (ev) => {
  const e = state.edit;
  if (ev.target.id === "q") { state.q = ev.target.value; renderList(); return; }
  if (!e) return;
  if (ev.target.id === "moveNote" || ev.target.id === "assignNote") e.note = ev.target.value;
  if (ev.target.id === "newTeacher") {
    e.newTeacher = ev.target.value;
    const btn = document.querySelector('[data-act="saveAssign"]');
    if (btn) btn.disabled = !e.newTeacher.trim();
  }
});

render();

// ---------- shared changes (claude.ai) ----------
(async () => {
  if (!window.claude?.use) { renderTop(); return; }
  try {
    [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  } catch (e) { db = null; }
  if (!db) { renderTop(); return; }
  dbReady = true;
  const can = user ? await user.can("data.write") : null;
  canWrite = can !== false;
  db.collection("changes").onSnapshot((snap) => {
    changes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (state.edit && !sessionsOf(state.edit.key).length) state.edit = null;
    render();
  }, () => { dbReady = false; canWrite = false; render(); });
  render();
})();
</script>
