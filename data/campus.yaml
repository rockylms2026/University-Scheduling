# Campus Space Plan: classrooms, laboratories, and PE venues.
# Source: Campus Space Plan (final, four colleges) and University Class Time Frame documents.

# Departments housed in each building. Classes are placed in their
# department's building when possible.
buildings:
  DIW: {name: Diwa Hall, college: CSBS, departments: [Psychology, Social Work]}
  MAL: {name: Malaya Hall, college: CSBS, departments: [Political Science, Communication]}
  KAT: {name: Katarungan Hall, college: CSBS, departments: [Criminology]}
  SIN: {name: Sinag Hall, college: CILS, departments: [Information Technology]}
  LIW: {name: Liwanag Hall, college: CILS, departments: [Library and Information Science]}
  LIN: {name: Lingkod Hall, college: CILS, departments: [General Education, Religious Education]}
  SIP: {name: Sipag Hall, college: CBAPA, departments: [Accountancy]}
  TIY: {name: Tiyaga Hall, college: CBAPA, departments: [Business Administration, Public Administration]}
  YAM: {name: Yaman Hall, college: CBAPA, departments: [Tourism and Hospitality Management]}
  DUN: {name: Dunong Hall, college: COE, departments: [Secondary Education]}
  GAB: {name: Gabay Hall, college: COE, departments: [Elementary Education]}
  TAN: {name: Tanglaw Hall, college: COE, departments: [Secondary Education]}

# Each college's classrooms (45 seats). A section's classes, including its
# GE classes, use its own college's classrooms. 54 classrooms in all.
classrooms:
  CSBS: [DIW 201, DIW 202, DIW 203, DIW 204, DIW 301, DIW 302, DIW 303, DIW 304,
         MAL 301, MAL 302, MAL 303, MAL 304, KAT 301, KAT 302, KAT 303, KAT 304, KAT 305]
  CILS: [SIN 202, SIN 203, SIN 302, SIN 303, LIW 201, LIW 202]
  CBAPA: [SIP 201, SIP 202, SIP 203, SIP 301, SIP 302, SIP 303,
          TIY 201, TIY 202, TIY 203, TIY 301, TIY 302, YAM 203, YAM 204, YAM 302, YAM 303]
  COE: [DUN 201, DUN 202, DUN 203, DUN 301, DUN 302, DUN 303,
        GAB 201, GAB 202, TAN 104, TAN 201, TAN 202, TAN 301, TAN 302]

# Lingkod Hall overflow classrooms for any college that runs short (used only
# when a college's own rooms are full). LIN 303, the GE testing room, can also
# serve as a classroom but is kept for common examinations.
shared_classrooms: [LIN 205, LIN 301, LIN 302]

# Seminar rooms (24 seats) for small groups such as track and major groups.
seminar_rooms:
  CSBS: [DIW 305]
  CILS: [SIN 204]
  CBAPA: [SIP 304]
  COE: [TAN 203]

# Laboratory rooms. "blocks" are the lab blocks the time frame assigns to the
# room; other blocks are allowed only when these are full (penalised).
# Lecture parts of laboratory courses may also meet in the course's lab.
labs:
  css_computer_lab: {rooms: [DIW 205], blocks: [LA, LE]}
  psych_lab: {rooms: [DIW 108], blocks: [LA, LE]}
  audio_studio: {rooms: [MAL 201], blocks: [LC, LD, LG]}
  video_studio: {rooms: [MAL 202], blocks: [LC, LD, LG]}
  editing_lab: {rooms: [MAL 203], blocks: [LC, LD, LG]}
  photo_lab: {rooms: [MAL 204], blocks: [LC, LD, LG]}
  cisc_computer_lab: {rooms: [SIN 108, SIN 201, SIN 301]}   # SIN 108 is the networking laboratory
  lib_tech_lab: {rooms: [LIW 104]}
  cbe_computer_lab: {rooms: [SIP 204], blocks: [LB, LD, LF, LG]}
  kitchen: {rooms: [YAM 104], blocks: [LA, LC]}
  bar_lab: {rooms: [YAM 106], blocks: [LA, LC]}
  mock_hotel: {rooms: [YAM 201]}
  front_office_lab: {rooms: [YAM 202]}
  travel_lab: {rooms: [YAM 301]}
  edtech_lab: {rooms: [GAB 203], blocks: [LE, LG]}
  crime_photo_lab: {rooms: [KAT 201], blocks: [LA, LC, LE, LG]}
  crime_dactyloscopy_lab: {rooms: [KAT 202], blocks: [LA, LC, LE, LG]}
  crime_chemistry_lab: {rooms: [KAT 203], blocks: [LA, LC, LE, LG]}
  polygraph_room: {rooms: [KAT 204], blocks: [LA, LC, LE, LG]}
  ballistics_room: {rooms: [KAT 205], blocks: [LA, LC, LE, LG]}

# University PE facilities. "classes_at_once" is how many PE classes a
# venue can hold at the same time (an assumption: the plans do not say).
pe_venues:
  - {name: Gymnasium, classes_at_once: 2}
  - {name: Covered Court, classes_at_once: 1}
  - {name: Field, classes_at_once: 2}
  - {name: Dance Studio, classes_at_once: 1}

