# Office of the Vice President for Academic Affairs: organizational chart.
# Source: VPAA Organizational Chart (revised), with the Registrar's corrections:
# College of Social Sciences, GE Coordinator at marial@laucv.edu, no GE handler duties,
# Associate Deans also teach. Faculty (names, ranks, departments, duties) come from the
# college files; this file adds the offices, staff and reporting lines around them.
# How a position is filled: B Board appointment, P President's appointment after a search,
# E elected by the department faculty, D designated from the faculty, H hired, C confidential.
