councils:
- name: Academic Council
  kind: Governing body, not an office
  lines:
  - 'Chair: the University President; vice chair: the VPAA'
  - 'Members: the Dean, the five Associate Deans, the GE Coordinator, the University Registrar, and the University Librarian'
  - Elected faculty representatives, 1 to 2 per college
