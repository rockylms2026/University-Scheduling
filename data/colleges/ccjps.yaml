# College of Criminal Justice and Public Service
# Source: CCJPS Curricula and Faculty Loading Plan (steady state).
#
# Course entry forms:
#   CODE: Title                                   lecture course, 3 credits, 3 h/week
#   CODE: {title: ..., lab: <lab type>}           lab course, Lec 2 h + Lab 3 h (5 LU);
#                                                 lab types are listed in data/campus.yaml
#                                                 (a list gives fallbacks, best first)
#   CODE: {title: ..., kind: field, credits: 6, placement: [Mon, Wed, Fri]}
#                                                 internship / practicum: students are off
#                                                 campus on the placement days; the teacher
#                                                 gets one weekly supervision period
#
# Curriculum entries "CODE @X" run only for block X, or once for major/track group X.
# Loads list, per semester and faculty ID, "course: section, section, ...".
