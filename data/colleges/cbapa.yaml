# College of Business, Accountancy and Public Administration
# Source: CBAPA Curricula and Faculty Loading Plan (final, steady state).
#
# Course entry forms:
#   CODE: Title                                   lecture course, 3 credits, 3 h/week
#   CODE: {title: ..., lab: <lab type>}           lab course, Lec 2 h + Lab 3 h (5 LU); lab types are in
#                                                 data/campus.yaml (a list gives fallbacks, best first)
#   CODE: {title: ..., kind: field, credits: 6, placement: [Mon, Wed, Fri]}
#                                                 internship / practicum: students are off campus on the
#                                                 placement days; the teacher gets one weekly supervision period
# Curriculum entries "CODE @X" run once for track group X (Years 3 and 4).
# Loads list, per semester and faculty ID, "course: section, section, ...".
